# Cloudflare Workers static-assets deploy of the PWA shell. No Worker script - assets only.
# public/ is built by scripts/build_cloudflare_site.sh (the Cloudflare build command).
# Data is not bundled - the app fetches data/dashboard/*.json from raw.githubusercontent.com.
# Must match the Worker name in the Cloudflare dashboard (Workers Builds fails otherwise).
name = "fpl-analyser"
compatibility_date = "2026-09-01"

[assets]
directory = "public"
