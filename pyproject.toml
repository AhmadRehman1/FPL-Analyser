[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Correctness-first rule set: unused imports/names, undefined names, obvious bugs.
# Deliberately not enabling pycodestyle's stylistic checks (E501 in particular) -- this
# codebase's convention is long, dense prose comments/docstrings (see README.md's own
# "Design notes" section), and reflowing those to a line-length limit would be pure churn
# with no correctness value, not a real fix.
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Gates CI (see .github/workflows/tests.yml's typecheck job). The first real run found 94
# errors, nearly all the same pattern: con.execute(...).fetchone() indexed without a
# None-check. Each was resolved on its own facts, not blanket-suppressed: most are a query
# guaranteed by SQL semantics to return exactly one row (COUNT(*)/aggregate with no GROUP BY,
# a single-row INSERT ... RETURNING, nextval()) or by an invariant the surrounding code
# already enforces (a foreign key the caller validated earlier in the same function) -- each
# documented with an `assert row is not None, "<why>"` at the point of use, which narrows the
# type for mypy and turns a confusing NoneType crash into a clear, named failure if the
# invariant is ever actually violated.
