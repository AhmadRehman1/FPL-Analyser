name: Weekly walk-forward backtest (M7)

# scripts/run_backtest.py is a real ~1-2 hour job (full M1-M6 pipeline re-run against every
# historical 2024-25/2025-26 gameweek, plus recalibration -- see its own module docstring) --
# far too expensive for scheduled_pipeline.yml's own twice-daily cadence. It's also the ONLY
# thing that ever populates a real backtest_runs row: without it, the app's Track Record screen
# stays permanently stuck at "no walk-forward backtest has been run yet" even though
# reporting.build_track_record_summary()/scripts/export_track_record.py have always been ready
# to show real numbers the moment one exists. Runs weekly instead -- a real backtest's own
# numbers don't meaningfully change gameweek to gameweek, so daily freshness buys nothing here
# unlike scheduled_pipeline.yml's live squad/transfer data.
#
# Restores the most recent scheduled_pipeline.yml run's cached DB (same `duckdb-` prefix
# restore-key match on_demand_report.yml already uses) rather than re-running the full M0-M6
# ingestion here -- real historical fact tables are already in that cache, and re-ingesting
# would just add ~20-25 minutes to an already ~1-2 hour job for no benefit. Falls back to a
# fresh ingestion only if no scheduled run has ever cached one yet.
#
# Deliberately does NOT re-run scripts/run_report.py itself (which also writes
# data/report_history/ snapshots + latest_diff.json, both already fully owned by
# scheduled_pipeline.yml's own twice-daily call) -- scripts/export_track_record.py writes only
# app_track_record.json, so this job can never race that one for the same committed files.

on:
  schedule:
    - cron: "0 3 * * 0"    # 03:00 UTC every Sunday -- off-peak, once a week is enough
  workflow_dispatch: {}

permissions:
  contents: write

# A real run is long (~1-2h); queue rather than overlap a manual dispatch with the weekly one.
concurrency:
  group: weekly-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # real run is ~1-2h; generous headroom under GitHub's own 360m job cap
    steps:
      - name: Checkout FPL-Analyser
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Pinned lockfile, not requirements.txt -- see requirements.lock's own header for why
      # (SCIP tie-breaking and DuckDB constraint behavior are version-sensitive here).
      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Restore the most recent ingested DB
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: db/fpl_quant_v2.duckdb
          key: duckdb-restore-only-no-such-exact-key
          restore-keys: |
            duckdb-

      # Same cache-miss fallback as on_demand_report.yml's own steps of the same name -- only
      # hit on the very first run ever, before any scheduled_pipeline.yml run has cached a DB.
      - name: Fetch FPL-Core-Insights (public dataset) [cache miss fallback]
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/olbauday/FPL-Core-Insights.git \
            data/external/FPL-Core-Insights-main

      - name: Materialize evidence workbooks [cache miss fallback]
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/external
          fetch_drive_file() {
            local file_id="$1" out_path="$2"
            curl -sSL --fail --retry 5 --retry-delay 10 --retry-all-errors \
              "https://drive.google.com/uc?export=download&id=${file_id}" -o "${out_path}"
            local size
            size=$(stat -c%s "${out_path}")
            if [ "${size}" -lt 1024 ]; then
              echo "::error::${out_path} downloaded too small (${size} bytes) -- likely an interstitial/error page, not the real workbook"
              exit 1
            fi
            if head -c 256 "${out_path}" | grep -qi "<html"; then
              echo "::error::${out_path} looks like an HTML page, not an .xlsx workbook (Google Drive virus-scan interstitial?)"
              exit 1
            fi
          }
          fetch_drive_file "1DkoW82AD_kgN0VtKf9bjC2EyANmFPpAx" "data/external/FPL_Evidence_Claims_Research_Pull.xlsx"
          fetch_drive_file "190aVAPUl3zlwJCDXXofZdJEaGQ8NPCBC" "data/external/FPL_202627_Master_Evidence_Database.xlsx"

      - name: Run ingestion (M0-M6) [cache miss fallback]
        if: steps.cache.outputs.cache-hit != 'true'
        run: PYTHONPATH=src python scripts/run_ingestion.py

      - name: Run walk-forward backtest (M7) -- real ~1-2 hour job
        run: PYTHONPATH=src python scripts/run_backtest.py

      - name: Export the real track record for the app
        run: PYTHONPATH=src python scripts/export_track_record.py

      - name: Commit the real track record + recalibration seeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dashboard/app_track_record.json data/recalibration/
          git diff --cached --quiet && exit 0
          git commit -m "chore: weekly walk-forward backtest -- real track record [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/5) -- fetching and rebasing onto the new master"
            git fetch origin master
            git rebase origin/master
          done
          echo "::error::git push kept failing after 5 rebase-and-retry attempts"
          exit 1
