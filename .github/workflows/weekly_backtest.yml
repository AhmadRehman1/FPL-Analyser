name: Weekly heavy jobs (M7 backtest + leaderboard)

# Two scripts share this job because they share the same real constraint: both are genuinely
# too expensive for scheduled_pipeline.yml's twice-daily cadence, and both were, until this
# workflow existed, never scheduled ANYWHERE -- two separate, real instances of this project's
# own recurring bug class (a fully-built, tested feature whose export script nothing ever
# actually invokes, so its panel silently renders nothing forever; scheduled_pipeline.yml's own
# "Grade squad + explain best move" step comment documents two earlier instances of exactly
# this).
#
# scripts/run_backtest.py: a real ~1-2 hour job (full M1-M6 pipeline re-run against every
# historical 2024-25/2025-26 gameweek, plus recalibration -- see its own module docstring). The
# ONLY thing that ever populates a real backtest_runs row: without it, the app's Track Record
# screen stays permanently stuck at "no walk-forward backtest has been run yet" even though
# reporting.build_track_record_summary()/scripts/export_track_record.py have always been ready
# to show real numbers the moment one exists.
#
# scripts/export_leaderboard.py: a real MIQP solve + Monte Carlo simulation per gameweek in its
# window -- its own module docstring already says "deliberately NOT wired into the automatic
# scheduled pipeline" for exactly that cost reason, and says to "run manually/periodically,
# same cadence as run_season_simulation.py itself" -- which never actually happened anywhere,
# so the app's "Model vs baselines" panel (profile sheet) has been silently empty since it
# shipped. Independent of the backtest step above (it runs its own self-contained
# run_season_simulation(), not a read of run_backtest.py's output) -- kept in the same job
# purely to reuse the one DB-restore-or-ingest cost, not because either depends on the other.
#
# Neither backtest's own numbers meaningfully change gameweek to gameweek, so weekly instead of
# twice-daily loses nothing real, unlike scheduled_pipeline.yml's live squad/transfer data.
#
# Restores the most recent scheduled_pipeline.yml run's cached DB (same `duckdb-` prefix
# restore-key match on_demand_report.yml already uses) rather than re-running the full M0-M6
# ingestion here -- real historical fact tables are already in that cache, and re-ingesting
# would just add ~20-25 minutes to an already long job for no benefit. Falls back to a fresh
# ingestion only if no scheduled run has ever cached one yet.
#
# Deliberately does NOT re-run scripts/run_report.py itself (which also writes
# data/report_history/ snapshots + latest_diff.json, both already fully owned by
# scheduled_pipeline.yml's own twice-daily call) -- scripts/export_track_record.py writes only
# app_track_record.json, so this job can never race that one for the same committed files.

on:
  schedule:
    - cron: "0 3 * * 0"    # 03:00 UTC every Sunday -- off-peak, once a week is enough
  workflow_dispatch: {}

permissions:
  contents: write

# A real run is long (~1-2h); queue rather than overlap a manual dispatch with the weekly one.
concurrency:
  group: weekly-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # real run is ~1-2h; generous headroom under GitHub's own 360m job cap
    steps:
      - name: Checkout FPL-Analyser
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Pinned lockfile, not requirements.txt -- see requirements.lock's own header for why
      # (SCIP tie-breaking and DuckDB constraint behavior are version-sensitive here).
      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Restore the most recent ingested DB
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: db/fpl_quant_v2.duckdb
          key: duckdb-restore-only-no-such-exact-key
          restore-keys: |
            duckdb-

      # Same cache-miss fallback as on_demand_report.yml's own steps of the same name -- only
      # hit on the very first run ever, before any scheduled_pipeline.yml run has cached a DB.
      - name: Fetch FPL-Core-Insights (public dataset) [cache miss fallback]
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/olbauday/FPL-Core-Insights.git \
            data/external/FPL-Core-Insights-main

      - name: Materialize evidence workbooks [cache miss fallback]
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/external
          fetch_drive_file() {
            local file_id="$1" out_path="$2"
            curl -sSL --fail --retry 5 --retry-delay 10 --retry-all-errors \
              "https://drive.google.com/uc?export=download&id=${file_id}" -o "${out_path}"
            local size
            size=$(stat -c%s "${out_path}")
            if [ "${size}" -lt 1024 ]; then
              echo "::error::${out_path} downloaded too small (${size} bytes) -- likely an interstitial/error page, not the real workbook"
              exit 1
            fi
            if head -c 256 "${out_path}" | grep -qi "<html"; then
              echo "::error::${out_path} looks like an HTML page, not an .xlsx workbook (Google Drive virus-scan interstitial?)"
              exit 1
            fi
          }
          [ -f "data/external/FPL_Evidence_Claims_Research_Pull.xlsx" ] && echo "using committed research pull" || fetch_drive_file "1DkoW82AD_kgN0VtKf9bjC2EyANmFPpAx" "data/external/FPL_Evidence_Claims_Research_Pull.xlsx"
          fetch_drive_file "190aVAPUl3zlwJCDXXofZdJEaGQ8NPCBC" "data/external/FPL_202627_Master_Evidence_Database.xlsx"

      - name: Run ingestion (M0-M6) [cache miss fallback]
        if: steps.cache.outputs.cache-hit != 'true'
        run: PYTHONPATH=src python scripts/run_ingestion.py

      - name: Run walk-forward backtest (M7) -- real ~1-2 hour job
        run: PYTHONPATH=src python scripts/run_backtest.py

      - name: Export the real track record for the app
        run: PYTHONPATH=src python scripts/export_track_record.py

      # export_leaderboard.py's own module docstring is explicit that this is "deliberately NOT
      # wired into the automatic scheduled pipeline" -- a real MIQP solve + Monte Carlo
      # simulation per gameweek in its window is genuinely too expensive for the twice-daily
      # schedule, same reasoning as run_backtest.py above -- but says to "run manually/
      # periodically, same cadence as run_season_simulation.py itself", which never actually
      # happened anywhere either, so the app's "Model vs baselines" panel (profile sheet,
      # leaderboardBlock()) has been silently empty since it shipped. This job already pays the
      # DB-restore cost for the backtest step above; independent of whether that step succeeds
      # (run_season_simulation() here is its own self-contained real simulation, not a read of
      # run_backtest.py's own output).
      # continue-on-error: its default window (GW2-6) needs those gameweeks to have real,
      # completed results to simulate against -- early in a season (as now: only GW1-2 played)
      # that window may have few or none yet, which could raise rather than gracefully return a
      # thin/empty result. A secondary panel failing here must never take down the backtest
      # step's own already-succeeded commit -- same "allowed to fail independently" philosophy
      # as on_demand_report.yml's own "Grade squad + explain best move" step.
      - name: Export the real model-vs-baselines leaderboard
        continue-on-error: true
        run: PYTHONPATH=src python scripts/export_leaderboard.py

      - name: Commit the real track record + leaderboard + recalibration seeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # nullglob: the leaderboard step above is continue-on-error, so leaderboard_*.json may
          # not exist this run -- without nullglob, bash passes that literal unmatched pattern
          # through to `git add`, which errors ("did not match any files") and -- run: steps use
          # `bash -e` by default -- would abort this whole step before the track-record file
          # (which DID succeed) ever gets committed.
          shopt -s nullglob
          # leaderboard_<date>.json (not just _latest.json) on purpose -- export_leaderboard.py's
          # own comment keeps the dated file as "the historical/audit record", same convention
          # export_projections.py uses for projections_<date>.json (committed via
          # scheduled_pipeline.yml's own broad `git add data/dashboard/`). app_track_record.json
          # has no dated sibling -- export_track_record.py deliberately only ever writes the one
          # stable file, a simpler design since a superseded backtest_run_id isn't a meaningful
          # thing to keep a dated trail of the way a leaderboard snapshot is.
          git add data/dashboard/app_track_record.json data/recalibration/
          leaderboard_files=(data/dashboard/leaderboard_*.json)
          [ ${#leaderboard_files[@]} -gt 0 ] && git add "${leaderboard_files[@]}"
          git diff --cached --quiet && exit 0
          git commit -m "chore: weekly walk-forward backtest -- real track record [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/5) -- fetching and rebasing onto the new master"
            git fetch origin master
            git rebase origin/master
          done
          echo "::error::git push kept failing after 5 rebase-and-retry attempts"
          exit 1
