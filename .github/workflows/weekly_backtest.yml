name: Weekly leaderboard

# scripts/export_leaderboard.py: a real MIQP solve + Monte Carlo simulation per completed
# gameweek of the current season (GW2 -> last finished GW), feeding the profile sheet's "Model
# vs baselines" panel. Early in a season it writes an explicit {"status": "insufficient_data"}
# payload and exits 0 (see the script's own docstring). Restores the most recent
# scheduled_pipeline.yml run's cached DB rather than re-ingesting.
#
# The former `backtest` job here (run_backtest.py = walk-forward + every refit + auto-promote
# in one job) was REMOVED: it was cancelled at the 6h Actions cap on every real dispatch. Its
# two halves now run separately and reliably -- nightly_backtest.yml (walk-forward -> the Track
# Record panel) and recalibrate.yml (the chunked refit techniques -> proposals).

on:
  schedule:
    - cron: "0 3 * * 0"    # 03:00 UTC every Sunday -- off-peak, once a week is enough
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-leaderboard
  cancel-in-progress: false

jobs:
  # run_season_simulation() over the completed gameweeks of the current season is ~minutes
  # early on, growing to ~1h by late season; 120m is comfortable headroom.
  leaderboard:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout FPL-Analyser
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Restore the most recent ingested DB
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: db/fpl_quant_v2.duckdb
          key: duckdb-restore-only-no-such-exact-key
          restore-keys: |
            duckdb-

      - name: Fetch FPL-Core-Insights (public dataset) [cache miss fallback]
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/olbauday/FPL-Core-Insights.git \
            data/external/FPL-Core-Insights-main

      - name: Materialize evidence workbooks [cache miss fallback]
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/external
          fetch_drive_file() {
            local file_id="$1" out_path="$2"
            curl -sSL --fail --retry 5 --retry-delay 10 --retry-all-errors \
              "https://drive.google.com/uc?export=download&id=${file_id}" -o "${out_path}"
            local size
            size=$(stat -c%s "${out_path}")
            if [ "${size}" -lt 1024 ]; then
              echo "::error::${out_path} downloaded too small (${size} bytes) -- likely an interstitial/error page, not the real workbook"
              exit 1
            fi
            if head -c 256 "${out_path}" | grep -qi "<html"; then
              echo "::error::${out_path} looks like an HTML page, not an .xlsx workbook (Google Drive virus-scan interstitial?)"
              exit 1
            fi
          }
          [ -f "data/external/FPL_Evidence_Claims_Research_Pull.xlsx" ] && echo "using committed research pull" || fetch_drive_file "1DkoW82AD_kgN0VtKf9bjC2EyANmFPpAx" "data/external/FPL_Evidence_Claims_Research_Pull.xlsx"
          fetch_drive_file "190aVAPUl3zlwJCDXXofZdJEaGQ8NPCBC" "data/external/FPL_202627_Master_Evidence_Database.xlsx"

      - name: Run ingestion (M0-M6) [cache miss fallback]
        if: steps.cache.outputs.cache-hit != 'true'
        run: PYTHONPATH=src python scripts/run_ingestion.py

      # No continue-on-error: the script itself now handles the "not enough completed gameweeks
      # yet" case by writing an explicit insufficient_data payload and exiting 0, so a non-zero
      # exit here is a real failure worth failing the job over.
      - name: Export the real model-vs-baselines leaderboard
        run: PYTHONPATH=src python scripts/export_leaderboard.py

      - name: Commit the leaderboard snapshot
        run: |
          # leaderboard_<date>.json (not just _latest.json) on purpose -- export_leaderboard.py's
          # own comment keeps the dated file as "the historical/audit record".
          shopt -s nullglob
          bash scripts/ci_commit_generated.sh \
            "chore: weekly model-vs-baselines leaderboard [skip ci]" \
            data/dashboard/leaderboard_latest.json data/dashboard/leaderboard_*.json
