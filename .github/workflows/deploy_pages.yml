name: Deploy PWA to GitHub Pages

# Hosts the static PWA shell (index.html / track-record.html / sw.js / manifest.json / icons)
# on GitHub Pages -- the free, official way to give the app a real public URL
# (https://<owner>.github.io/FPL-Analyser/). The shell is the only thing deployed here: it is
# intentionally small, and it never bundles the data/dashboard/*.json payloads -- those stay on
# raw.githubusercontent.com/master, which the PWA (and the standalone track-record.html page)
# fetch directly with cache: "no-store". That split is deliberate: raw.githubusercontent.com
# reflects a freshly committed per-manager JSON within ~1 min (the on_demand_report.yml "add your
# team" workflow's whole SLA depends on that), whereas GitHub Pages has a CDN build/cache cadence
# too coarse for the live, per-request data path. So Pages hosts the app + public track-record
# page; raw hosts the data. Both are free.
#
# One-time setup (repo owner only): Settings -> Pages -> Build and deployment -> Source =
# "GitHub Actions". After that, every push to master redeploys automatically. No secrets needed.

on:
  push:
    branches: [master]
    # Only the static shell is deployed here (see below), so a commit that touches ONLY
    # generated data never needs a redeploy. The scheduled pipelines already tag those
    # commits `[skip ci]` (which suppresses this push trigger), but the tracked pipelines
    # also touch data/ every ~1-2h now (live_data.yml) -- make the intent explicit and
    # robust to a future data commit that forgets the tag.
    paths-ignore:
      - 'data/**'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time -- a newer push should not race an older one's deploy.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Stage only the static shell -- keeps the Pages artifact tiny and avoids shipping the
      # Python venv, DuckDB pipeline, tests, or the data/ dir (which lives on raw for freshness).
      - name: Stage static site
        run: |
          mkdir -p site
          cp index.html landing.html track-record.html sw.js manifest.json .nojekyll site/
          cp -r icons site/
          # Track D-4 (docs/plans/2026-08_roadmap_plan.md; docs/BUSINESS_PLAN.md 2.7): stages a
          # real `CNAME` file only if one exists at the repo root -- there isn't one today (see
          # CNAME.example for the placeholder + the exact steps to go live), so this is a no-op
          # until the operator registers a domain, configures its DNS, and creates a real `CNAME`
          # file themselves. Deliberately NOT unconditional: staging a bogus/placeholder hostname
          # would make GitHub Pages try to configure it as this site's live custom domain, which
          # could affect the already-working github.io URL before DNS is ever set up for real.
          if [ -f CNAME ]; then cp CNAME site/; fi
          # App gap 7 / docs/BUSINESS_PLAN.md 2.5: a STAGING fork can set the repo variable
          # FQ_STAGING=1 to also deploy data/dashboard/ + committed data/ alongside the shell,
          # then point index.html at same-origin via <meta name="fq-data-base" content="">. The
          # canonical repo leaves FQ_STAGING unset, so this is a no-op there and the raw-URL /
          # add-team-SLA split is untouched.
          if [ "${{ vars.FQ_STAGING }}" = "1" ]; then
            mkdir -p site/data
            cp -r data/dashboard site/data/ 2>/dev/null || true
            [ -f data/elite_managers.json ] && cp data/elite_managers.json site/data/ || true
            echo "FQ_STAGING: bundled data/dashboard into the Pages artifact"
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
