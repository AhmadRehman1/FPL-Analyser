name: Weekly rank autopsy (top-100k instrumentation)

# Priority 10 Phase B -- the rank measurement + attribution instrument. See
# docs/priority10_field_simulator_design.md and src/fpl_quant/field_rank.py.
#
# Why this exists, separate from nightly_backtest.yml: the nightly walk-forward scores
# model_squad_realized_points - avg_manager_points, a synthetic POINTS delta over 2024-25 +
# 2025-26. The model-managed team's real goal is overall rank ~top 100k, and points are not
# rank -- a squad +2 pts/GW that owns the template and captains the obvious pick lands ~500k.
# This job samples a real, stratified slice of rival squads for each completed 2026-27
# gameweek (scripts/run_rival_sample_ingestion.py) and scores the model's optimal squad + the
# two tracked accounts against that field, decomposing the gap into captaincy / template /
# differential / bench (scripts/rank_autopsy.py -> data/dashboard/rank_autopsy.json).
#
# Forward-only by construction: FPL's API serves only current-season picks, so there is no
# historical rival data to rank-score the walk-forward against. This starts accumulating from
# 2026-27 GW1 (GW1-2 backfilled on the first run).
#
# Weekly, Tuesday 08:00 UTC -- after Monday Night Football and the overnight bonus settle, so
# every fixture of the just-finished gameweek is final. It does NOT change the optimiser
# (that's Phase C); it only measures and reports.

on:
  schedule:
    - cron: "0 8 * * 2"
  workflow_dispatch:
    inputs:
      replace_events:
        description: >-
          Comma-separated gameweeks to re-sample even though they're already stored
          (e.g. "1,2,3") -- for samples built with an older/wrong strategy. ~200 FPL API
          requests per gameweek. Leave blank for the normal idempotent run.
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: rank-tracking
  cancel-in-progress: false

jobs:
  rank-autopsy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout FPL-Analyser
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Pinned lockfile -- DuckDB constraint behavior is version-sensitive and this job both
      # reads and writes the shared DB cache. Matches nightly_backtest.yml.
      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Restore the most recent ingested DB
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: db/fpl_quant_v2.duckdb
          key: duckdb-restore-only-no-such-exact-key
          restore-keys: |
            duckdb-

      # Cache-miss fallback -- identical to nightly_backtest.yml / weekly_backtest.yml. Only
      # ever executes before any scheduled_pipeline.yml run has cached a DB.
      - name: Fetch FPL-Core-Insights (public dataset) [cache miss fallback]
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/olbauday/FPL-Core-Insights.git \
            data/external/FPL-Core-Insights-main

      - name: Materialize evidence workbooks [cache miss fallback]
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/external
          fetch_drive_file() {
            local file_id="$1" out_path="$2"
            curl -sSL --fail --retry 5 --retry-delay 10 --retry-all-errors \
              "https://drive.google.com/uc?export=download&id=${file_id}" -o "${out_path}"
            local size
            size=$(stat -c%s "${out_path}")
            if [ "${size}" -lt 1024 ]; then
              echo "::error::${out_path} downloaded too small (${size} bytes) -- likely an interstitial/error page, not the real workbook"
              exit 1
            fi
            if head -c 256 "${out_path}" | grep -qi "<html"; then
              echo "::error::${out_path} looks like an HTML page, not an .xlsx workbook (Google Drive virus-scan interstitial?)"
              exit 1
            fi
          }
          [ -f "data/external/FPL_Evidence_Claims_Research_Pull.xlsx" ] && echo "using committed research pull" || fetch_drive_file "1DkoW82AD_kgN0VtKf9bjC2EyANmFPpAx" "data/external/FPL_Evidence_Claims_Research_Pull.xlsx"
          fetch_drive_file "190aVAPUl3zlwJCDXXofZdJEaGQ8NPCBC" "data/external/FPL_202627_Master_Evidence_Database.xlsx"

      - name: Run ingestion (M0-M6) [cache miss fallback]
        if: steps.cache.outputs.cache-hit != 'true'
        run: PYTHONPATH=src python scripts/run_ingestion.py

      # ~200 real requests to FPL's own API per not-yet-sampled completed gameweek. Idempotent
      # per (season, event); a first run backfills the season (bounded by MAX_GAMEWEEKS_PER_RUN).
      - name: Sample rival squads for completed gameweeks
        env:
          RIVAL_SAMPLE_REPLACE_EVENTS: ${{ github.event.inputs.replace_events }}
        run: PYTHONPATH=src python scripts/run_rival_sample_ingestion.py

      - name: Run the rank autopsy
        run: PYTHONPATH=src python scripts/rank_autopsy.py

      # Persist the DB (now carrying the rival sample + fact_squad_rank_score rows) so the next
      # run doesn't re-sample already-sampled gameweeks. Same key family the pipeline uses.
      - name: Cache the updated DB
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: db/fpl_quant_v2.duckdb
          key: duckdb-rank-tracking-${{ github.run_id }}

      - name: Commit the rank autopsy
        run: |
          bash scripts/ci_commit_generated.sh \
            "chore: weekly rank autopsy [skip ci]" \
            data/dashboard/rank_autopsy.json
