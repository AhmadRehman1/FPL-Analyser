name: Weekly ML residual-challenger experiment (Track F, Phase F-4)

# Runs research/ml/'s real Phase-0 residual ML experiment (docs/plans/2026-08_retrospective_
# validation_and_ml_decision_plan.md, Track F) against the production database on a real,
# open-internet GitHub Actions runner -- automating the one thing every prior sandboxed session
# working on Track F could not do: this repo's own Claude Code Remote sandbox has no populated
# db/fpl_quant_v2.duckdb and blocks outbound access to fantasy.premierleague.com by policy.
#
# WALK-FORWARD PROVISIONING (added 2026-08-30): research/ml/experiment.py reads
# `backtest_gameweek_steps` -- the walk-forward's per-gameweek asof predictions. Nothing else
# in this repo's cloud pipeline produces those: scheduled_pipeline.yml caches an M0-M6
# ingestion-only DB (~40 MB, no walk-forward), and weekly_backtest.yml runs the full
# scripts/run_backtest.py whose recalibration tail exceeds a GitHub Actions job's 6h hard cap
# (a real dispatch on 2026-08-25 was cancelled at 5h, unfinished) and never saves its DB back.
# So this workflow runs the walk-forward itself, via scripts/run_walkforward.py -- backtest.run()
# only, no recalibration, ~1-2h, comfortably inside the job budget -- and caches the resulting
# DB keyed on a hash of the model code + deps + active param seeds. A later run that changed
# only research/ml/ hits that cache and skips straight to the experiment (~30-60m); a run that
# changed src/fpl_quant/** or the confirmed recalibration seeds rebuilds the walk-forward.
#
# research/ml/ is explicitly a non-production research layer (research/ml/README.md: "does not
# modify live production recommendations") -- kept in its own workflow file rather than added
# to weekly_backtest.yml's job so a slow or failing research run can never eat into that job's
# own timeout budget or block its production Track Record commit.
#
# Does NOT commit research/ml/results/ back to the repo: it stays gitignored on purpose, and
# REPORT.md's actual decision prose is a real analytical judgment call each run
# (scripts/summarize_ml_experiment_results.py's own docstring) -- not something to
# template-generate unattended. The real numbers land in this run's job summary (via
# $GITHUB_STEP_SUMMARY) and the full results/ directory uploads as a build artifact.
#
# One narrow, deliberate exception: scripts/append_ml_run_to_history.py appends this run's real
# bootstrap-CI numbers and season-manager points -- nothing else, never prose or a decision --
# to research/ml/results_history/weekly_quality_history.csv, which IS tracked in git, and this
# workflow commits just that one file back. That tracked ledger is the only place the "is the
# model improving over real weeks" question can be answered by looking at real numbers.

on:
  schedule:
    # 05:00 UTC every Sunday -- two hours after weekly_backtest.yml's own 03:00 UTC Sunday run.
    - cron: "0 5 * * 0"
  workflow_dispatch:
    inputs:
      fold_mode:
        description: >-
          research.ml.experiment --fold-mode value. Leave blank for the module's own default
          (exhaustive gameweek walk-forward -- the real Phase F-4 run). "season" is a much
          cheaper one-fold-per-season sanity check.
        required: false
        type: choice
        options: ["", "gameweek", "season"]
        default: ""
      runs:
        description: >-
          research.ml.experiment --runs value: repeat the experiment this many times with
          consecutive seeds (42, 43, ...), appending each to research/ml/results/experiment_runs.csv
          (uploaded as an artifact). Use >1 to measure seed-to-seed stability of the aggregate
          result and the per-slice regression in one job. Default 1.
        required: false
        default: "1"
      rebuild_walkforward:
        description: >-
          Force a fresh walk-forward even if the cache has one for this model code. Use after a
          change this workflow's cache key doesn't capture. Default false.
        required: false
        type: boolean
        default: false

permissions:
  # write, not read: this workflow commits exactly one file back --
  # research/ml/results_history/weekly_quality_history.csv. Nothing else in the job writes to
  # the repo; research/ml/results/ itself stays gitignored.
  contents: write

concurrency:
  group: ml-experiment
  cancel-in-progress: false

jobs:
  run-experiment:
    runs-on: ubuntu-latest
    # Walk-forward (~1-2h on a miss) + experiment (~30-60m) + margin. Well under GitHub's 360m
    # cap. A cache hit on the walk-forward makes the real run ~1h.
    timeout-minutes: 330
    steps:
      - name: Checkout FPL-Analyser
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.lock
          pip install -r requirements-research.txt

      # The walk-forward DB (carries backtest_gameweek_steps). Keyed on everything that changes
      # what the walk-forward produces: the M1-M6 model code, the pinned deps, and the
      # git-committed confirmed recalibration seeds (active_recalibratable_versions reads these).
      # Exact-key restore is a deliberate miss (no run writes this literal); the restore-keys
      # prefix picks up the newest cache for this same model-code hash.
      - name: Restore walk-forward DB
        id: wfcache
        if: ${{ github.event.inputs.rebuild_walkforward != 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: db/fpl_quant_v2.duckdb
          key: walkforward-v1-${{ hashFiles('src/fpl_quant/**/*.py', 'requirements.lock', 'data/recalibration/*.json') }}-none
          restore-keys: |
            walkforward-v1-${{ hashFiles('src/fpl_quant/**/*.py', 'requirements.lock', 'data/recalibration/*.json') }}-

      - name: Note walk-forward cache result
        run: |
          if [ "${{ steps.wfcache.outputs.cache-matched-key }}" != "" ]; then
            echo "WALKFORWARD_CACHE_HIT=true" >> "$GITHUB_ENV"
            echo "Reusing walk-forward DB from cache: ${{ steps.wfcache.outputs.cache-matched-key }}"
          else
            echo "WALKFORWARD_CACHE_HIT=false" >> "$GITHUB_ENV"
            echo "No walk-forward cache for this model code -- will build it."
          fi

      # ---- everything from here to "Save walk-forward DB" runs only on a walk-forward miss ----

      - name: Restore the most recent ingested DB (walk-forward seed)
        id: ingestcache
        if: env.WALKFORWARD_CACHE_HIT == 'false'
        uses: actions/cache/restore@v6
        with:
          path: db/fpl_quant_v2.duckdb
          key: duckdb-restore-only-no-such-exact-key
          restore-keys: |
            duckdb-

      - name: Fetch FPL-Core-Insights (public dataset) [ingestion fallback]
        if: env.WALKFORWARD_CACHE_HIT == 'false' && steps.ingestcache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/olbauday/FPL-Core-Insights.git \
            data/external/FPL-Core-Insights-main

      - name: Materialize evidence workbooks [ingestion fallback]
        if: env.WALKFORWARD_CACHE_HIT == 'false' && steps.ingestcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/external
          fetch_drive_file() {
            local file_id="$1" out_path="$2"
            curl -sSL --fail --retry 5 --retry-delay 10 --retry-all-errors \
              "https://drive.google.com/uc?export=download&id=${file_id}" -o "${out_path}"
            local size
            size=$(stat -c%s "${out_path}")
            if [ "${size}" -lt 1024 ]; then
              echo "::error::${out_path} downloaded too small (${size} bytes) -- likely an interstitial/error page"
              exit 1
            fi
            if head -c 256 "${out_path}" | grep -qi "<html"; then
              echo "::error::${out_path} looks like an HTML page, not an .xlsx workbook"
              exit 1
            fi
          }
          fetch_drive_file "1DkoW82AD_kgN0VtKf9bjC2EyANmFPpAx" "data/external/FPL_Evidence_Claims_Research_Pull.xlsx"
          fetch_drive_file "190aVAPUl3zlwJCDXXofZdJEaGQ8NPCBC" "data/external/FPL_202627_Master_Evidence_Database.xlsx"

      - name: Run ingestion (M0-M6) [ingestion fallback]
        if: env.WALKFORWARD_CACHE_HIT == 'false' && steps.ingestcache.outputs.cache-hit != 'true'
        run: PYTHONPATH=src python scripts/run_ingestion.py

      - name: Run the walk-forward (backtest.run only, no recalibration) [walk-forward miss]
        if: env.WALKFORWARD_CACHE_HIT == 'false'
        run: PYTHONPATH=src python scripts/run_walkforward.py

      - name: Save walk-forward DB to cache [walk-forward miss]
        if: env.WALKFORWARD_CACHE_HIT == 'false'
        uses: actions/cache/save@v6
        with:
          path: db/fpl_quant_v2.duckdb
          key: walkforward-v1-${{ hashFiles('src/fpl_quant/**/*.py', 'requirements.lock', 'data/recalibration/*.json') }}-${{ github.run_id }}

      # ---- experiment ----

      # Optional seed-stability sweep FIRST: `--runs N` sends every artifact into per-run
      # subdirs (research/ml/experiment.py::run_loop via redirect_results_to) + a rolling
      # research/ml/results/experiment_runs.csv. It deliberately does NOT write the top-level
      # results/ files, so it can't feed append_ml_run_to_history.py -- that's what the
      # canonical single run below is for. The sweep's value is purely the seed-to-seed spread,
      # captured in the uploaded artifact.
      - name: Seed-stability sweep [only if runs > 1]
        if: ${{ (github.event.inputs.runs || '1') != '1' }}
        env:
          FOLD_MODE: ${{ github.event.inputs.fold_mode }}
          RUNS: ${{ github.event.inputs.runs }}
        run: |
          ARGS="--runs $RUNS"
          [ -n "$FOLD_MODE" ] && ARGS="$ARGS --fold-mode $FOLD_MODE"
          echo "python -m research.ml.experiment $ARGS"
          python -m research.ml.experiment $ARGS

      # Canonical single run (seed 42): writes the top-level research/ml/results/ artifacts that
      # append_ml_run_to_history.py + the job summary read. Always runs.
      - name: Run the real Phase-0 residual ML experiment (Track F, Phase F-4)
        env:
          FOLD_MODE: ${{ github.event.inputs.fold_mode }}
        run: |
          ARGS=""
          [ -n "$FOLD_MODE" ] && ARGS="--fold-mode $FOLD_MODE"
          echo "python -m research.ml.experiment $ARGS"
          python -m research.ml.experiment $ARGS

      - name: Append this run to the tracked quality-trend history
        run: python scripts/append_ml_run_to_history.py

      - name: Commit the updated quality-trend history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/ml/results_history/weekly_quality_history.csv
          if git diff --cached --quiet; then
            echo "No change to the quality-trend history this run."
          else
            git commit -m "chore(ml): append weekly quality-trend history [skip ci]"
            for attempt in 1 2 3 4 5; do
              git push && exit 0
              echo "push rejected (attempt $attempt/5) -- fetch + rebase onto the new head"
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase "origin/${GITHUB_REF_NAME}"
            done
            echo "::error::git push kept failing after 5 rebase-and-retry attempts"
            exit 1
          fi

      - name: Install Ollama and pull phi4-mini [best-effort]
        continue-on-error: true
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags >/dev/null && break; sleep 2; done
          ollama pull phi4-mini

      - name: Narrate this run's results with the local model [best-effort]
        continue-on-error: true
        run: python scripts/narrate_ml_results.py

      - name: Summarize real results into the job summary
        if: always()
        run: |
          {
            echo "## Real ML experiment run -- $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "- walk-forward cache hit: \`${WALKFORWARD_CACHE_HIT:-unknown}\`"
            echo "- fold_mode: \`${{ github.event.inputs.fold_mode || '(default: gameweek)' }}\`   runs: \`${{ github.event.inputs.runs || '1' }}\`"
            echo ""
            echo '```'
            python scripts/summarize_ml_experiment_results.py 2>&1 || echo "(summarize script failed or found no results -- see the experiment step for the real error)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload real experiment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-experiment-results-${{ github.run_id }}
          path: |
            research/ml/results/
          if-no-files-found: warn
          retention-days: 90
