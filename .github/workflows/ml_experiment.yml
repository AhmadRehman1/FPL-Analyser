name: Weekly ML residual-challenger experiment (Track F, Phase F-4)

# Runs research/ml/'s real Phase-0 residual ML experiment (docs/plans/2026-08_retrospective_
# validation_and_ml_decision_plan.md, Track F) against the production database on a real,
# open-internet GitHub Actions runner -- automating the one thing every prior sandboxed session
# working on Track F could not do: this repo's own Claude Code Remote sandbox has no populated
# db/fpl_quant_v2.duckdb and blocks outbound access to fantasy.premierleague.com by policy, so
# Phase F-4 (the real experiment run the whole workstream exists to produce) had never actually
# executed anywhere before this workflow existed -- every REPORT.md status note said so
# explicitly. This runner has neither restriction (same reasoning scheduled_pipeline.yml's own
# header already gives for why its scheduling lives here, not as a Claude Code Remote Routine).
#
# research/ml/ is explicitly a non-production research layer (research/ml/README.md: "does not
# modify live production recommendations") -- kept in its own workflow file rather than added
# as a third step to weekly_backtest.yml's job so a slow or failing research run can never eat
# into that job's own timeout budget or block its production Track Record commit. The real
# per-fold model-fitting cost of exhaustive gameweek walk-forward against the full production
# dataset has never been measured (no environment has run it for real before this), so the
# timeout below is deliberately generous rather than guessed tight; narrow it once a real run's
# actual wall-clock time is known.
#
# Does NOT commit research/ml/results/ back to the repo: it stays gitignored on purpose, and
# REPORT.md's actual decision prose is a real analytical judgment call each run
# (scripts/summarize_ml_experiment_results.py's own docstring) -- not something to
# template-generate unattended. The real numbers land in this run's job summary (via
# $GITHUB_STEP_SUMMARY) for a human to read without downloading anything, and the full results/
# directory uploads as a build artifact for deeper inspection or to hand-copy into REPORT.md's
# real §1-§11 write-up.
#
# One narrow, deliberate exception: scripts/append_ml_run_to_history.py appends this run's real
# bootstrap-CI numbers (quant_lightgbm/quant_xgboost point estimates, CI bounds, whether each
# excludes zero) and season-manager points -- nothing else, never prose or a decision -- to
# research/ml/results_history/weekly_quality_history.csv, which IS tracked in git, and this
# workflow commits just that one file back. A single run's results/ tells you nothing about
# whether the model is improving over time; a 90-day, per-run build artifact doesn't either.
# This tracked ledger is the only place that question can actually be answered by looking at
# real numbers across real weeks as the season's data grows. See that script's own docstring.

on:
  schedule:
    # 05:00 UTC every Sunday -- two hours after weekly_backtest.yml's own 03:00 UTC Sunday run,
    # so both never contend for the same DB-restore cache write/read window even though neither
    # strictly depends on the other (cache/restore is read-only and safe to run concurrently
    # regardless). Weekly, not daily: matches weekly_backtest.yml's own reasoning -- a walk-
    # forward research result over historical data doesn't meaningfully change gameweek to
    # gameweek, and this is explicitly non-production research, not a live-data pipeline.
    - cron: "0 5 * * 0"
  workflow_dispatch:
    inputs:
      fold_mode:
        description: >-
          research.ml.experiment --fold-mode value. Leave blank for the module's own default
          (exhaustive gameweek walk-forward -- the real Phase F-4 run). "season" is a much
          cheaper one-fold-per-season sanity check, useful for an ad-hoc manual run without
          waiting on the full exhaustive mode.
        required: false
        type: choice
        options: ["", "gameweek", "season"]
        default: ""

permissions:
  # write, not read: this workflow commits exactly one file back (see the header above) --
  # research/ml/results_history/weekly_quality_history.csv. Nothing else in the job writes to
  # the repo; research/ml/results/ itself stays gitignored and untouched by git entirely.
  contents: write

# A real exhaustive walk-forward run is long and of genuinely unknown duration (see the header
# above); queue rather than overlap a manual dispatch with the scheduled run.
concurrency:
  group: ml-experiment
  cancel-in-progress: false

jobs:
  run-experiment:
    runs-on: ubuntu-latest
    # Generous headroom under GitHub's own 360-minute job cap -- see the header above on why
    # this is deliberately not tuned tight yet: no real run has ever measured the actual cost.
    timeout-minutes: 340
    steps:
      - name: Checkout FPL-Analyser
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Pinned lockfile (see requirements.lock's own header) plus research/ml/'s own separate,
      # exactly-pinned ML dependencies (requirements-research.txt's own header explains why
      # these are never part of requirements.lock/requirements.txt: no production/pipeline
      # install should have to pull in scikit-learn/lightgbm just to serve a real user).
      - name: Install dependencies
        run: |
          pip install -r requirements.lock
          pip install -r requirements-research.txt

      # Same `duckdb-` prefix restore-key match on_demand_report.yml and weekly_backtest.yml
      # already use -- reuses the most recent scheduled_pipeline.yml run's freshly-ingested DB
      # rather than re-running the full ~20-25 minute M0-M6 ingestion here.
      - name: Restore the most recent ingested DB
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: db/fpl_quant_v2.duckdb
          key: duckdb-restore-only-no-such-exact-key
          restore-keys: |
            duckdb-

      # Same cache-miss fallback as weekly_backtest.yml/on_demand_report.yml's own steps of the
      # same name -- only hit on the very first run ever, before any scheduled_pipeline.yml run
      # has cached a DB.
      - name: Fetch FPL-Core-Insights (public dataset) [cache miss fallback]
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/olbauday/FPL-Core-Insights.git \
            data/external/FPL-Core-Insights-main

      - name: Materialize evidence workbooks [cache miss fallback]
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/external
          fetch_drive_file() {
            local file_id="$1" out_path="$2"
            curl -sSL --fail --retry 5 --retry-delay 10 --retry-all-errors \
              "https://drive.google.com/uc?export=download&id=${file_id}" -o "${out_path}"
            local size
            size=$(stat -c%s "${out_path}")
            if [ "${size}" -lt 1024 ]; then
              echo "::error::${out_path} downloaded too small (${size} bytes) -- likely an interstitial/error page, not the real workbook"
              exit 1
            fi
            if head -c 256 "${out_path}" | grep -qi "<html"; then
              echo "::error::${out_path} looks like an HTML page, not an .xlsx workbook (Google Drive virus-scan interstitial?)"
              exit 1
            fi
          }
          fetch_drive_file "1DkoW82AD_kgN0VtKf9bjC2EyANmFPpAx" "data/external/FPL_Evidence_Claims_Research_Pull.xlsx"
          fetch_drive_file "190aVAPUl3zlwJCDXXofZdJEaGQ8NPCBC" "data/external/FPL_202627_Master_Evidence_Database.xlsx"

      - name: Run ingestion (M0-M6) [cache miss fallback]
        if: steps.cache.outputs.cache-hit != 'true'
        run: PYTHONPATH=src python scripts/run_ingestion.py

      # research.ml's own __init__.py bootstraps src/ onto sys.path itself (see its module
      # docstring), so `python -m research.ml.experiment` needs no PYTHONPATH here. Empty
      # fold_mode input (the default: unset on a scheduled run, or "" chosen on a manual
      # dispatch) means "use the module's own default" -- exhaustive gameweek walk-forward,
      # the real Phase F-4 run this workflow exists to finally make possible.
      - name: Run the real Phase-0 residual ML experiment (Track F, Phase F-4)
        env:
          FOLD_MODE: ${{ github.event.inputs.fold_mode }}
        run: |
          if [ -n "$FOLD_MODE" ]; then
            python -m research.ml.experiment --fold-mode "$FOLD_MODE"
          else
            python -m research.ml.experiment
          fi

      # Appends this run's real bootstrap-CI numbers + season points to the tracked history
      # ledger (see the header above). Runs only if the experiment step above actually
      # succeeded and produced a manifest -- the script itself fails clearly if it didn't, which
      # is the right outcome here too (no silent partial row).
      - name: Append this run to the tracked quality-trend history
        run: python scripts/append_ml_run_to_history.py

      # [skip ci] matches this repo's own existing convention for automated commits (see
      # weekly_backtest.yml's Track Record commit) -- stops this push from re-triggering
      # tests.yml/deploy_pages.yml (both push-triggered on master) for a data-only commit.
      - name: Commit the updated quality-trend history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/ml/results_history/weekly_quality_history.csv
          if git diff --cached --quiet; then
            echo "No change to the quality-trend history this run."
          else
            git commit -m "chore(ml): append weekly quality-trend history [skip ci]"
            git push
          fi

      # Best-effort, free-cloud local-LLM narration (research/ml/README.md's "Running locally
      # with Ollama" section): ubuntu-latest runners have no GPU, so this runs phi4-mini
      # (small, ~2.5GB, CPU-only here) rather than a larger model -- fine for a once-a-week,
      # non-interactive narration job. continue-on-error: true because this is a convenience,
      # not something that should ever turn a real experiment run red; if Ollama's own install
      # or the model pull is slow/unavailable this week, the run's real numbers (job summary +
      # artifact + the history ledger above) are entirely unaffected.
      - name: Install Ollama and pull phi4-mini [best-effort]
        continue-on-error: true
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags >/dev/null && break; sleep 2; done
          ollama pull phi4-mini

      - name: Narrate this run's results with the local model [best-effort]
        continue-on-error: true
        run: python scripts/narrate_ml_results.py

      # scripts/summarize_ml_experiment_results.py assembles the real numbers from every
      # results/ artifact into one structured, human-readable report -- posted to this run's
      # job summary so the real headline numbers (MAE, bootstrap CIs, season points, the R11
      # slicing check) are visible without downloading the artifact below. It does NOT decide
      # ship/no-ship itself (a real analytical judgment call, per its own module docstring) --
      # a human still writes REPORT.md's actual §9 decision from this output.
      - name: Summarize real results into the job summary
        if: always()
        run: |
          {
            echo "## Real ML experiment run -- $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo '```'
            python scripts/summarize_ml_experiment_results.py 2>&1 || echo "(summarize script failed or found no results -- see the step above for the real error)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # research/ml/results/ is deliberately gitignored (not committed) -- this is the artifact
      # path instead: every CSV/JSON/plot this run produced, downloadable for deeper inspection
      # or to hand-copy real numbers into REPORT.md. if-no-files-found: warn rather than error --
      # a run that failed before producing any output shouldn't itself fail this cleanup step.
      - name: Upload real experiment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-experiment-results-${{ github.run_id }}
          path: research/ml/results/
          if-no-files-found: warn
          retention-days: 90
