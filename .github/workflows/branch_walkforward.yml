name: Branch walk-forward (experiment)

# Before/after evidence for a model change without touching master. Runs the same walk-forward
# as nightly_backtest.yml on an experiment branch (bt/**), against the most recent cached
# ingested DB, then prints scripts/walkforward_summary.py's scoreboard to the log and uploads
# it as an artifact. Commits nothing.
#
# A dispatch can also pass `args` (scripts/run_walkforward.py's experiment flags, e.g.
# "--lambda 0.10" or "--assist-prior-xa 30"), so several arms run from one ref in parallel.

on:
  push:
    branches: ["bt/**"]
  workflow_dispatch:
    inputs:
      args:
        description: 'Experiment flags for scripts/run_walkforward.py (empty = the live control).'
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: branch-walkforward-${{ github.ref }}-${{ inputs.args }}
  cancel-in-progress: true

jobs:
  walkforward:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Restore the most recent ingested DB
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: db/fpl_quant_v2.duckdb
          key: duckdb-restore-only-no-such-exact-key
          restore-keys: |
            duckdb-

      - name: Fail if no cached DB
        run: |
          test -f db/fpl_quant_v2.duckdb || { echo "::error::no cached DB to run against"; exit 1; }

      - name: Run walk-forward
        env:
          ARGS: ${{ inputs.args }}
        run: |
          echo "arm args: '${ARGS}'" >> "$GITHUB_STEP_SUMMARY"
          # word-splitting of ARGS is intended: it carries the flags. --max-minutes stops the walk
          # before the job's 330-minute limit, so a long arm still reaches the scoreboard below
          # (its "progress" block then says how many steps it scored); --seasons 2025-2026 walks
          # the season with FPL's real average alone.
          PYTHONPATH=src python scripts/run_walkforward.py --max-minutes 300 ${ARGS}

      - name: Scoreboard
        env:
          # which cached DB this arm ran on: scripts/compare_arms.py only compares runs on the same one
          DB_CACHE_KEY: ${{ steps.cache.outputs.cache-matched-key }}
        run: |
          PYTHONPATH=src python scripts/walkforward_summary.py | tee walkforward_summary.json
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat walkforward_summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: walkforward-summary
          path: walkforward_summary.json
