name: Nightly walk-forward backtest (track record)

# Why this exists, separate from weekly_backtest.yml:
#
# weekly_backtest.yml's `backtest` job runs scripts/run_backtest.py -- backtest.run() AND
# backtest.recalibrate(). The recalibration tail (the lambda-grid SCIP re-solves) alone
# exceeds GitHub Actions' 6h hard cap: real dispatches on 2026-08-25 and 2026-08-30 were both
# cancelled at ~5h having never reached export_track_record.py. Net effect: app_track_record.json
# -- the app's "proof the model works" panel, docs/BUSINESS_PLAN.md's P0 blocker -- has sat
# with backtest_run_id=null / metrics=[] the whole time, because the one job that populates it
# never finishes.
#
# This job runs scripts/run_walkforward.py instead: backtest.run() ONLY, no recalibration.
# That's the ~2-3h half that comfortably fits one Actions job (run_walkforward.py's own
# docstring; ml_experiment.yml has run it green since PR #73). It then exports the real track
# record. It does NOT propose or promote any recalibrated parameter -- recalibration stays a
# weekly, human-gated concern in weekly_backtest.yml / scripts/review_recalibration.py.
#
# Nightly (not weekly) because the walk-forward's numbers only move when the M1-M6 model code
# changes -- and this repo changes it often (#93, #105, #111, #113, ...). A nightly re-run means
# a model fix merged during the day is re-measured against the historical outcomes by morning,
# instead of carrying stale headline metrics until the next Sunday.
#
# run_report.py's own _would_regress_track_record() guard is the other half: the twice-daily
# scheduled_pipeline.yml run, starting from a backtest-less DB, will NOT overwrite the
# app_track_record.json this job commits (it only refreshes the planner_decision_accuracy
# sub-object in place).

on:
  schedule:
    - cron: "0 2 * * *"    # 02:00 UTC daily -- off-peak, clear of the 06:00/18:00 pipeline and Sunday's weekly jobs
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nightly-backtest
  cancel-in-progress: false

jobs:
  walkforward:
    runs-on: ubuntu-latest
    timeout-minutes: 330  # walk-forward is ~2-3h; matches ml_experiment.yml's budget for the same run
    steps:
      - name: Checkout FPL-Analyser
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Pinned lockfile, not requirements.txt -- SCIP tie-breaking and DuckDB constraint
      # behavior are version-sensitive here (see requirements.lock's own header).
      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Restore the most recent ingested DB
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: db/fpl_quant_v2.duckdb
          key: duckdb-restore-only-no-such-exact-key
          restore-keys: |
            duckdb-

      # Cache-miss fallback -- identical to weekly_backtest.yml / on_demand_report.yml. Only
      # ever executes on the very first run, before any scheduled_pipeline.yml run has cached a DB.
      - name: Fetch FPL-Core-Insights (public dataset) [cache miss fallback]
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/olbauday/FPL-Core-Insights.git \
            data/external/FPL-Core-Insights-main

      - name: Materialize evidence workbooks [cache miss fallback]
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/external
          fetch_drive_file() {
            local file_id="$1" out_path="$2"
            curl -sSL --fail --retry 5 --retry-delay 10 --retry-all-errors \
              "https://drive.google.com/uc?export=download&id=${file_id}" -o "${out_path}"
            local size
            size=$(stat -c%s "${out_path}")
            if [ "${size}" -lt 1024 ]; then
              echo "::error::${out_path} downloaded too small (${size} bytes) -- likely an interstitial/error page, not the real workbook"
              exit 1
            fi
            if head -c 256 "${out_path}" | grep -qi "<html"; then
              echo "::error::${out_path} looks like an HTML page, not an .xlsx workbook (Google Drive virus-scan interstitial?)"
              exit 1
            fi
          }
          [ -f "data/external/FPL_Evidence_Claims_Research_Pull.xlsx" ] && echo "using committed research pull" || fetch_drive_file "1DkoW82AD_kgN0VtKf9bjC2EyANmFPpAx" "data/external/FPL_Evidence_Claims_Research_Pull.xlsx"
          fetch_drive_file "190aVAPUl3zlwJCDXXofZdJEaGQ8NPCBC" "data/external/FPL_202627_Master_Evidence_Database.xlsx"

      - name: Run ingestion (M0-M6) [cache miss fallback]
        if: steps.cache.outputs.cache-hit != 'true'
        run: PYTHONPATH=src python scripts/run_ingestion.py

      - name: Run walk-forward backtest (M7) -- backtest.run() only, no recalibration
        run: PYTHONPATH=src python scripts/run_walkforward.py

      - name: Export the real track record for the app
        run: PYTHONPATH=src python scripts/export_track_record.py

      - name: Commit the real track record
        run: |
          bash scripts/ci_commit_generated.sh \
            "chore: nightly walk-forward backtest -- real track record [skip ci]" \
            data/dashboard/app_track_record.json
