name: Scheduled FPL pipeline (Priority 8a/8b)

# Was originally one real cron entry per real gameweek deadline (each exactly 1 day before
# `deadline_time`) -- deliberately abandoned. That design meant the freshest a real recommendation
# ever got was a single run 24h before the deadline: team news, price moves, and injury updates
# in that last day were never reflected, and a single failed run left the whole gameweek on
# stale data with no automatic retry until next week. It also needed a manual re-sync (re-run
# print_fpl_deadlines.py, paste the new cron column in) every time a fixture got postponed or
# rescheduled, since GitHub Actions cron can't be dynamically rescheduled from inside a run.
#
# Now: runs twice a day, every day, unconditionally -- no deadline-tracking at all. Self-
# maintaining (a postponed fixture doesn't invalidate anything), and at most ~12h stale instead
# of up to a week. `concurrency` below queues a run instead of overlapping it with the previous
# one, since a full run (ingestion + both accounts + all exports) takes ~20-25 minutes.
# workflow_dispatch still exists for an immediate manual/adjusted run any time in between.
#
# This runner has open internet (unlike the Claude Code Remote sandbox this pipeline was
# originally built in, which blocks understat.com and similar third-party hosts by policy) --
# that's specifically why the scheduling lives here, not as a Claude Code Remote Routine.
on:
  schedule:
    - cron: "0 6 * * *"    # 06:00 UTC daily
    - cron: "0 18 * * *"   # 18:00 UTC daily
  workflow_dispatch:
    inputs:
      real_squad_entry_id:
        description: >-
          Optional: a real FPL manager's entry_id (fantasy.premierleague.com/entry/<id>/...).
          When set, runs scripts/run_transfer_planner_for_real_squad.py against their real
          squad after ingestion, using the SAME freshly-ingested database this run just built
          (that script needs real ts_model_version/mm_model_version/etc. from this run --
          see its own module docstring). Left blank on scheduled runs; this only ever fires
          when someone explicitly asks for it via a manual dispatch.
        required: false
        type: string
      real_squad_event:
        description: "The gameweek the entry_id's CURRENT squad is set for (plans for the next one)."
        required: false
        default: "1"
        type: string

permissions:
  contents: write
  issues: write

# A run takes ~20-25 minutes; twice-daily scheduled runs are already far enough apart to never
# overlap, but a manual workflow_dispatch could land mid-run. Queue rather than run in parallel
# (both would fight over the same git push) or cancel (a run in progress is real, wanted work,
# not stale work to throw away).
concurrency:
  group: scheduled-fpl-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FPL-Analyser
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Pinned lockfile, not requirements.txt -- see requirements.lock's own header for why
      # (SCIP tie-breaking and DuckDB constraint behavior are version-sensitive here).
      - name: Install dependencies
        run: pip install -r requirements.lock

      # data/external/ is gitignored (see README's own "Design notes" on why) -- provisioned
      # fresh each run rather than committed, since the FPL-Core-Insights extract is large and
      # the two evidence workbooks are private/curated. olbauday/FPL-Core-Insights' real
      # layout (data/<season>/{players,playerstats,teams,...}.csv) was verified directly
      # against a real clone before writing this step -- not assumed.
      - name: Fetch FPL-Core-Insights (public dataset)
        run: |
          git clone --depth 1 https://github.com/olbauday/FPL-Core-Insights.git \
            data/external/FPL-Core-Insights-main

      # The two evidence workbooks are private/curated, not publicly fetchable. Both are fetched
      # from a Google Drive file set to "Anyone with the link" (Viewer) -- a real, accepted
      # trade-off (unguessable-link privacy, not true access control) chosen over committing them
      # to this PUBLIC repo or attaching them as public Release assets, both of which would be
      # strictly worse (indexed/discoverable, not just unguessable). The `uc?export=download` URL
      # pattern is Google's own standard mechanism for a public Drive file's raw bytes.
      #
      # FPL_Evidence_Claims_Research_Pull.xlsx (~15KB) was originally stored as a base64-encoded
      # repo secret instead, since it comfortably fits under GitHub Actions' 64KB-per-secret cap.
      # That approach was abandoned after a real run failed with a zlib decompression error --
      # the secret had been corrupted by an incomplete copy-paste of the ~20,700-character
      # base64 string on a phone. Drive-fetch has no such manual-paste step, so it's used for
      # both files now regardless of size.
      #
      # Google interstitials a virus-scan warning page instead of a direct download for files
      # over ~25MB; both files here (well under 1MB) shouldn't hit that, but re-check if a
      # future, larger version of either workbook starts failing here.
      # --fail/--retry: a bare curl here previously had no retry at all -- one transient Drive
      # hiccup failed the whole ~20-25 minute run. --retry-all-errors covers a transient HTTP
      # error code, not just a connection drop. The size/HTML sniff below catches the other
      # real failure mode this step can hit silently: a "successful" 200 response that's
      # actually Google's virus-scan interstitial page (see the comment above), which curl
      # alone has no way to distinguish from a real .xlsx download.
      - name: Materialize evidence workbooks
        run: |
          mkdir -p data/external
          fetch_drive_file() {
            local file_id="$1" out_path="$2"
            curl -sSL --fail --retry 5 --retry-delay 10 --retry-all-errors \
              "https://drive.google.com/uc?export=download&id=${file_id}" -o "${out_path}"
            local size
            size=$(stat -c%s "${out_path}")
            if [ "${size}" -lt 1024 ]; then
              echo "::error::${out_path} downloaded too small (${size} bytes) -- likely an interstitial/error page, not the real workbook"
              exit 1
            fi
            if head -c 256 "${out_path}" | grep -qi "<html"; then
              echo "::error::${out_path} looks like an HTML page, not an .xlsx workbook (Google Drive virus-scan interstitial?)"
              exit 1
            fi
          }
          fetch_drive_file "1DkoW82AD_kgN0VtKf9bjC2EyANmFPpAx" "data/external/FPL_Evidence_Claims_Research_Pull.xlsx"
          fetch_drive_file "190aVAPUl3zlwJCDXXofZdJEaGQ8NPCBC" "data/external/FPL_202627_Master_Evidence_Database.xlsx"

      # Records what this run's fragile upstream inputs (FPL-Core-Insights commit, evidence
      # workbook contents, installed package versions) actually WERE, next to the report
      # snapshots this same run commits below -- see the script's own module docstring for why
      # (the lost-local-DB incident is exactly the kind of gap this closes). Best-effort and
      # never raises: an absent input is reported via ::warning:: rather than failing the run.
      - name: Record source provenance manifest
        run: PYTHONPATH=src python scripts/record_provenance.py

      - name: Run ingestion (M0-M6)
        run: PYTHONPATH=src python scripts/run_ingestion.py

      # Multi-user roadmap item: the on-demand-report.yml workflow needs a freshly-ingested
      # DB to bootstrap a NEW manager's transfer plan from (M8) without re-running the entire
      # M0-M7 pipeline itself (expensive, and pointless duplicate work of what THIS job just
      # did). actions/cache is the free, GitHub-native way to hand that file to a later,
      # separate workflow run -- no external storage/DB service needed. Key is unique per run
      # (github.run_id) so every scheduled run always writes a fresh entry; the on-demand
      # workflow finds it via a `duckdb-` prefix restore-key match (newest wins), not this exact
      # key, since it can't predict a run_id it wasn't part of. Saved right after ingestion,
      # before the per-account transfer-planner steps below -- those only add manager-specific
      # state on top and the on-demand workflow bootstraps its own fresh manager state anyway,
      # so the cached snapshot doesn't need to (and shouldn't have to) wait on them.
      - name: Cache the freshly-ingested DB for on-demand manager requests
        uses: actions/cache/save@v6
        with:
          path: db/fpl_quant_v2.duckdb
          key: duckdb-${{ github.run_id }}

      # Same real bootstrap-static-derived resolver app_export.current_event() already gives
      # export_live_data.py/export_projections.py/track_elite.py and on_demand_report.yml's own
      # "Determine current gameweek" step (mirrored verbatim here) -- replaces what used to be a
      # hardcoded real_squad_event that someone had to remember to bump by hand at every
      # gameweek boundary (and didn't, for three days after GW1's 2026-08-21 deadline: Home/
      # Team/Transfers kept serving a week-old squad and free-transfer count off the
      # already-finished GW1 until it was manually bumped to 2 on 2026-08-24).
      - name: Determine current gameweek
        id: gw
        run: |
          python3 - <<'PYEOF'
          import os
          import sys

          sys.path.insert(0, "src")
          from fpl_quant import app_export as ax

          bootstrap = ax.fetch_bootstrap_static()
          event = ax.current_event(bootstrap)
          if event is None:
              print("::error::bootstrap-static reports no current gameweek right now")
              raise SystemExit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"event={event}\n")
          PYEOF

      # Real perf fix, not a new feature (see scripts/compute_shared_horizon.py's own module
      # docstring for the full account): grade_squad.py, explain_my_move.py, and
      # run_scenarios.py each independently recomputed the SAME account-agnostic multi-
      # gameweek EP+uncertainty horizon for both real managers -- a real, measured root cause
      # (not a hypothesis) behind this pipeline's actual wall-clock time badly exceeding this
      # workflow's own ~20-25-minute estimate above (a real run: "Grade squad + explain best
      # move" took 44 minutes and "Run bench what-if scenarios" took 3h42m). Computed ONCE
      # here and exported via $GITHUB_ENV so every later step in this same job picks it up
      # automatically; those three scripts fall back to their own original per-call
      # computation whenever this step (or the env var) is absent, so this is a pure opt-in,
      # not a new hard dependency. run_transfer_planner_for_real_squad.py deliberately does
      # NOT consume this -- it runs tp.run() with rho_residual_params_version=1, not the 2
      # every other real-squad script (and this shared-horizon computation) uses, a real
      # pre-existing discrepancy this fix does not paper over.
      - name: Compute shared multi-gameweek horizon once (perf fix, not per-script)
        env:
          EVENT: ${{ steps.gw.outputs.event }}
        run: |
          PYTHONPATH=src python scripts/compute_shared_horizon.py "$EVENT" /tmp/fpl_shared_horizon_ep_versions.json
          echo "FPL_SHARED_HORIZON_FILE=/tmp/fpl_shared_horizon_ep_versions.json" >> "$GITHUB_ENV"

      # Runs for real on every scheduled run (not manual-dispatch-only anymore) for both real
      # FPL accounts this project tracks -- has to live in THIS job, right after ingestion,
      # since it needs the same ephemeral database run_ingestion.py just populated in this same
      # runner (see run_transfer_planner_for_real_squad.py's own module docstring). Sequential,
      # not two separate workflow runs -- avoids ever needing the git-push race-retry logic
      # below for this step's own output, since both write their JSON snapshot within the same
      # job/checkout.
      - name: Plan transfers for both real managers' squads
        env:
          EVENT: ${{ steps.gw.outputs.event }}
        run: |
          PYTHONPATH=src python scripts/run_transfer_planner_for_real_squad.py 7139944 "$EVENT" "ChatGPT template team"
          PYTHONPATH=src python scripts/run_transfer_planner_for_real_squad.py 1305242 "$EVENT" "Main account"

      # Real bug fixed here: Feature 2 ("Rate My Team") and Feature 3 ("Explain My Move", the
      # README's own "strategic centerpiece") were both fully built, tested, and wired into
      # index.html's fetch calls (squad_grade_<id>_latest.json / decision_<id>_latest.json,
      # both via .catch(() => null)) -- but neither script was ever actually invoked by this
      # workflow, so those JSON files never existed in production and both panels silently
      # rendered nothing for real users, indefinitely. Needs the same freshly-ingested DB and
      # current-gameweek value as the transfer-planner step just above.
      - name: Grade squad + explain best move for both real managers
        env:
          EVENT: ${{ steps.gw.outputs.event }}
        run: |
          PYTHONPATH=src python scripts/grade_squad.py 7139944 "$EVENT"
          PYTHONPATH=src python scripts/grade_squad.py 1305242 "$EVENT"
          PYTHONPATH=src python scripts/explain_my_move.py 7139944 "$EVENT"
          PYTHONPATH=src python scripts/explain_my_move.py 1305242 "$EVENT"

      # Feature 4 ("what-if" scenarios), same gap and same fix as the step above: built and
      # tested (src/fpl_quant/scenario.py) but never actually run by anything before this.
      # See run_scenarios.py's own module docstring for its real, disclosed v1 scope (bench
      # lineup_change what-ifs only, not the full interactive layer scenario.py's docstring
      # describes -- this static PWA has no request-handling backend to be interactive with).
      - name: Run bench what-if scenarios for both real managers
        env:
          EVENT: ${{ steps.gw.outputs.event }}
        run: |
          PYTHONPATH=src python scripts/run_scenarios.py 7139944 "$EVENT"
          PYTHONPATH=src python scripts/run_scenarios.py 1305242 "$EVENT"

      # Real, computed (not invented) fixture-swing signal for both accounts' current squads,
      # covering GW3-19 -- see the script's own docstring for what "swing" means and its real
      # caveat (squad composition will change via transfers before most of these gameweeks
      # arrive, so this is a live-refreshed signal, not a locked-in plan).
      - name: Print first-half chip-timing roadmap
        run: PYTHONPATH=src python scripts/print_chip_timing_roadmap.py

      # Roadmap Feature 1's real per-player, per-gameweek xPts table (scripts/export_projections.py)
      # -- same "built but never invoked" gap as grade_squad.py/explain_my_move.py above: the
      # frontend's Team-tab Planner and the multi-gameweek Plan tab both fetch
      # data/dashboard/projections_latest.json via .catch(() => null), but nothing in this
      # workflow ever ran the script that produces it, so it has never existed in production --
      # both panels silently show "no projections published yet" for real users, indefinitely.
      # Passes the same current-gameweek value (steps.gw) every other per-gameweek step here
      # uses, rather than letting the script's own live bootstrap-static fallback drift from it
      # independently. (Found and fixed independently on two branches at once -- this is the
      # version that reuses steps.gw.outputs.event rather than paying for a second live fetch.)
      - name: Export player-pool point projections
        env:
          EVENT: ${{ steps.gw.outputs.event }}
        run: PYTHONPATH=src python scripts/export_projections.py "$EVENT"

      # Ad-hoc: real_squad_entry_id workflow_dispatch input still works for a THIRD account (or
      # a one-off re-check) without needing a code change -- the two real accounts above always
      # run regardless of this input. workflow_dispatch inputs are an insider-only threat
      # (triggering a manual run already requires push access to this repo), but sanitized to
      # digits-only and routed via env: anyway -- same pattern on_demand_report.yml uses for its
      # genuinely public, untrusted issue-body input, rather than splicing ${{ }} straight into
      # run: for one input type and not the other.
      - name: Sanitize ad-hoc real_squad inputs
        id: real_squad
        if: github.event.inputs.real_squad_entry_id != ''
        env:
          RAW_ENTRY_ID: ${{ github.event.inputs.real_squad_entry_id }}
          RAW_EVENT: ${{ github.event.inputs.real_squad_event }}
        run: |
          python3 - <<'PYEOF'
          import os
          import re

          entry_id = (os.environ.get("RAW_ENTRY_ID") or "").strip()
          event = (os.environ.get("RAW_EVENT") or "").strip()
          if not re.fullmatch(r"\d{1,10}", entry_id) or int(entry_id) <= 0:
              print(f"::error::real_squad_entry_id must be a positive integer, got {entry_id!r}")
              raise SystemExit(1)
          if not re.fullmatch(r"\d{1,3}", event) or int(event) <= 0:
              print(f"::error::real_squad_event must be a positive integer, got {event!r}")
              raise SystemExit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"entry_id={entry_id}\n")
              f.write(f"event={event}\n")
          PYEOF

      - name: Plan transfers for an ad-hoc real manager's squad (manual dispatch only)
        if: github.event.inputs.real_squad_entry_id != ''
        env:
          ENTRY_ID: ${{ steps.real_squad.outputs.entry_id }}
          EVENT: ${{ steps.real_squad.outputs.event }}
        run: |
          PYTHONPATH=src python scripts/run_transfer_planner_for_real_squad.py "$ENTRY_ID" "$EVENT"

      # App conversion, Phase 1: real, live data for the PWA's Team/Profile/Leagues/Fixtures/
      # Transfers-browse screens (data/dashboard/app_*.json) -- see app_export.py's own module
      # docstring for why this is a separate, non-modeled fetch from everything above. Same
      # auto-resolved current-gameweek value (steps.gw) as the transfer-planner step above --
      # never hardcoded, so this can't independently drift from it the way the two used to.
      - name: Export live app data (Team/Profile/Leagues/Fixtures/Players)
        env:
          EVENT: ${{ steps.gw.outputs.event }}
        run: |
          PYTHONPATH=src python scripts/export_app_data.py \
            "7139944:$EVENT:ChatGPT template team" \
            "1305242:$EVENT:Main account"

      - name: Build report + diff
        run: PYTHONPATH=src python scripts/run_report.py

      - name: Check for deadline alerts
        id: alerts
        run: PYTHONPATH=src python scripts/check_deadline_alerts.py

      - name: Open alert issue for newly-doubtful starters
        if: steps.alerts.outputs.has_alert == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deadline alert: newly doubtful starter(s) -- ${new Date().toISOString().slice(0, 10)}`,
              body: `${{ steps.alerts.outputs.alert_body }}`,
              labels: ["deadline-alert"],
            });

      # Priority 8c's snapshots (+ the real-squad dashboard snapshots above) are the point of
      # persisting anything here -- everything else (the DuckDB file itself) is gitignored and
      # rebuilt fresh next run. A real, observed failure mode (not hypothesized): two
      # workflow_dispatch runs finishing close together both tried to push this commit -- the
      # second's bare `git push` got rejected outright ("fetch first"), even though its own
      # content was perfectly valid and just needed to land on top of the first's. Retry with a
      # rebase (never force-push -- this is master) a few times rather than crashing the whole
      # run over a benign race between two legitimate pushes.
      - name: Commit report_history + dashboard snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/report_history/ data/dashboard/
          git diff --cached --quiet && exit 0
          git commit -m "chore: update report_history snapshot [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/5) -- fetching and rebasing onto the new master"
            git fetch origin master
            git rebase origin/master
          done
          echo "::error::git push kept failing after 5 rebase-and-retry attempts"
          exit 1
