name: Scheduled FPL pipeline (Priority 8a/8b)

# Priority 8a: "a scheduled job running the full pipeline automatically at price-lock time and
# deadline time each gameweek, not manually triggered." Real FPL deadlines aren't a fixed
# weekly time (postponements, double gameweeks, international breaks all shift them), so a
# generic "every Friday" cron was always the wrong shape. Below is instead one real cron entry
# per real 2026-27 gameweek deadline, each set to exactly 1 day before that gameweek's actual
# `deadline_time` -- generated by running scripts/print_fpl_deadlines.py for real against FPL's
# own bootstrap-static (see that script + .github/workflows/print_deadlines.yml), not
# hand-guessed. GW1 is omitted (already past at the time this was generated). GitHub Actions
# cron can't be dynamically rescheduled from inside a workflow run, so this list needs a manual
# re-sync (re-run print_deadlines.yml, paste the new cron column in) whenever the real season
# schedule changes -- postponements, rescheduled fixtures, a season's fixtures not yet being
# published when this was generated. workflow_dispatch exists for a manual/adjusted run any time
# in between.
#
# This runner has open internet (unlike the Claude Code Remote sandbox this pipeline was
# originally built in, which blocks understat.com and similar third-party hosts by policy) --
# that's specifically why the scheduling lives here, not as a Claude Code Remote Routine.
on:
  schedule:
    - cron: "30 17 27 8 *"   # GW2 deadline 2026-08-28 17:30 UTC, minus 1 day
    - cron: "30 17 3 9 *"    # GW3 deadline 2026-09-04 17:30 UTC, minus 1 day
    - cron: "30 12 11 9 *"   # GW4 deadline 2026-09-12 12:30 UTC, minus 1 day
    - cron: "30 17 17 9 *"   # GW5 deadline 2026-09-18 17:30 UTC, minus 1 day
    - cron: "0 10 9 10 *"    # GW6 deadline 2026-10-10 10:00 UTC, minus 1 day
    - cron: "0 10 16 10 *"   # GW7 deadline 2026-10-17 10:00 UTC, minus 1 day
    - cron: "30 17 22 10 *"  # GW8 deadline 2026-10-23 17:30 UTC, minus 1 day
    - cron: "0 11 30 10 *"   # GW9 deadline 2026-10-31 11:00 UTC, minus 1 day
    - cron: "30 13 6 11 *"   # GW10 deadline 2026-11-07 13:30 UTC, minus 1 day
    - cron: "30 13 20 11 *"  # GW11 deadline 2026-11-21 13:30 UTC, minus 1 day
    - cron: "30 13 27 11 *"  # GW12 deadline 2026-11-28 13:30 UTC, minus 1 day
    - cron: "30 18 1 12 *"   # GW13 deadline 2026-12-02 18:30 UTC, minus 1 day
    - cron: "30 13 4 12 *"   # GW14 deadline 2026-12-05 13:30 UTC, minus 1 day
    - cron: "30 13 11 12 *"  # GW15 deadline 2026-12-12 13:30 UTC, minus 1 day
    - cron: "30 13 18 12 *"  # GW16 deadline 2026-12-19 13:30 UTC, minus 1 day
    - cron: "30 13 25 12 *"  # GW17 deadline 2026-12-26 13:30 UTC, minus 1 day
    - cron: "30 18 29 12 *"  # GW18 deadline 2026-12-30 18:30 UTC, minus 1 day
    - cron: "30 13 1 1 *"    # GW19 deadline 2027-01-02 13:30 UTC, minus 1 day
    - cron: "30 18 5 1 *"    # GW20 deadline 2027-01-06 18:30 UTC, minus 1 day
    - cron: "30 13 15 1 *"   # GW21 deadline 2027-01-16 13:30 UTC, minus 1 day
    - cron: "30 13 22 1 *"   # GW22 deadline 2027-01-23 13:30 UTC, minus 1 day
    - cron: "30 13 29 1 *"   # GW23 deadline 2027-01-30 13:30 UTC, minus 1 day
    - cron: "30 13 5 2 *"    # GW24 deadline 2027-02-06 13:30 UTC, minus 1 day
    - cron: "30 18 9 2 *"    # GW25 deadline 2027-02-10 18:30 UTC, minus 1 day
    - cron: "30 13 19 2 *"   # GW26 deadline 2027-02-20 13:30 UTC, minus 1 day
    - cron: "30 13 26 2 *"   # GW27 deadline 2027-02-27 13:30 UTC, minus 1 day
    - cron: "30 18 2 3 *"    # GW28 deadline 2027-03-03 18:30 UTC, minus 1 day
    - cron: "30 13 12 3 *"   # GW29 deadline 2027-03-13 13:30 UTC, minus 1 day
    - cron: "30 13 19 3 *"   # GW30 deadline 2027-03-20 13:30 UTC, minus 1 day
    - cron: "30 12 9 4 *"    # GW31 deadline 2027-04-10 12:30 UTC, minus 1 day
    - cron: "30 12 16 4 *"   # GW32 deadline 2027-04-17 12:30 UTC, minus 1 day
    - cron: "30 12 23 4 *"   # GW33 deadline 2027-04-24 12:30 UTC, minus 1 day
    - cron: "30 12 30 4 *"   # GW34 deadline 2027-05-01 12:30 UTC, minus 1 day
    - cron: "30 12 7 5 *"    # GW35 deadline 2027-05-08 12:30 UTC, minus 1 day
    - cron: "30 12 14 5 *"   # GW36 deadline 2027-05-15 12:30 UTC, minus 1 day
    - cron: "30 12 22 5 *"   # GW37 deadline 2027-05-23 12:30 UTC, minus 1 day
    - cron: "30 13 29 5 *"   # GW38 deadline 2027-05-30 13:30 UTC, minus 1 day
  workflow_dispatch:
    inputs:
      real_squad_entry_id:
        description: >-
          Optional: a real FPL manager's entry_id (fantasy.premierleague.com/entry/<id>/...).
          When set, runs scripts/run_transfer_planner_for_real_squad.py against their real
          squad after ingestion, using the SAME freshly-ingested database this run just built
          (that script needs real ts_model_version/mm_model_version/etc. from this run --
          see its own module docstring). Left blank on scheduled runs; this only ever fires
          when someone explicitly asks for it via a manual dispatch.
        required: false
        type: string
      real_squad_event:
        description: "The gameweek the entry_id's CURRENT squad is set for (plans for the next one)."
        required: false
        default: "1"
        type: string

permissions:
  contents: write
  issues: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FPL-Analyser
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # data/external/ is gitignored (see README's own "Design notes" on why) -- provisioned
      # fresh each run rather than committed, since the FPL-Core-Insights extract is large and
      # the two evidence workbooks are private/curated. olbauday/FPL-Core-Insights' real
      # layout (data/<season>/{players,playerstats,teams,...}.csv) was verified directly
      # against a real clone before writing this step -- not assumed.
      - name: Fetch FPL-Core-Insights (public dataset)
        run: |
          git clone --depth 1 https://github.com/olbauday/FPL-Core-Insights.git \
            data/external/FPL-Core-Insights-main

      # The two evidence workbooks are private/curated, not publicly fetchable. Both are fetched
      # from a Google Drive file set to "Anyone with the link" (Viewer) -- a real, accepted
      # trade-off (unguessable-link privacy, not true access control) chosen over committing them
      # to this PUBLIC repo or attaching them as public Release assets, both of which would be
      # strictly worse (indexed/discoverable, not just unguessable). The `uc?export=download` URL
      # pattern is Google's own standard mechanism for a public Drive file's raw bytes.
      #
      # FPL_Evidence_Claims_Research_Pull.xlsx (~15KB) was originally stored as a base64-encoded
      # repo secret instead, since it comfortably fits under GitHub Actions' 64KB-per-secret cap.
      # That approach was abandoned after a real run failed with a zlib decompression error --
      # the secret had been corrupted by an incomplete copy-paste of the ~20,700-character
      # base64 string on a phone. Drive-fetch has no such manual-paste step, so it's used for
      # both files now regardless of size.
      #
      # Google interstitials a virus-scan warning page instead of a direct download for files
      # over ~25MB; both files here (well under 1MB) shouldn't hit that, but re-check if a
      # future, larger version of either workbook starts failing here.
      - name: Materialize evidence workbooks
        run: |
          mkdir -p data/external
          curl -sSL "https://drive.google.com/uc?export=download&id=1DkoW82AD_kgN0VtKf9bjC2EyANmFPpAx" \
            -o "data/external/FPL_Evidence_Claims_Research_Pull.xlsx"
          curl -sSL "https://drive.google.com/uc?export=download&id=190aVAPUl3zlwJCDXXofZdJEaGQ8NPCBC" \
            -o "data/external/FPL_202627_Master_Evidence_Database.xlsx"

      - name: Run ingestion (M0-M6)
        run: PYTHONPATH=src python scripts/run_ingestion.py

      # Opt-in (real_squad_entry_id workflow_dispatch input only) -- see that input's own
      # description above for why this has to run in THIS job, right after ingestion, rather
      # than as a separately-triggerable workflow: it needs the same ephemeral database
      # run_ingestion.py just populated in this same runner.
      - name: Plan transfers for a real manager's squad (manual dispatch only)
        if: github.event.inputs.real_squad_entry_id != ''
        run: |
          PYTHONPATH=src python scripts/run_transfer_planner_for_real_squad.py \
            "${{ github.event.inputs.real_squad_entry_id }}" \
            "${{ github.event.inputs.real_squad_event }}"

      - name: Build report + diff
        run: PYTHONPATH=src python scripts/run_report.py

      - name: Check for deadline alerts
        id: alerts
        run: PYTHONPATH=src python scripts/check_deadline_alerts.py

      - name: Open alert issue for newly-doubtful starters
        if: steps.alerts.outputs.has_alert == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deadline alert: newly doubtful starter(s) -- ${new Date().toISOString().slice(0, 10)}`,
              body: `${{ steps.alerts.outputs.alert_body }}`,
              labels: ["deadline-alert"],
            });

      # Priority 8c's snapshots are the point of persisting anything here -- everything else
      # (the DuckDB file itself) is gitignored and rebuilt fresh next run. A real, observed
      # failure mode (not hypothesized): two workflow_dispatch runs (e.g. one per real FPL
      # account, see real_squad_entry_id above) finishing close together both try to push this
      # commit -- the second's bare `git push` gets rejected outright ("fetch first"), even
      # though its own report_history content is perfectly valid and just needs to land on top
      # of the first's. Retry with a rebase (never force-push -- this is master) a few times
      # rather than crashing the whole run over a benign race between two legitimate pushes.
      - name: Commit report_history snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/report_history/
          git diff --cached --quiet && exit 0
          git commit -m "chore: update report_history snapshot [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/5) -- fetching and rebasing onto the new master"
            git fetch origin master
            git rebase origin/master
          done
          echo "::error::git push kept failing after 5 rebase-and-retry attempts"
          exit 1
