name: On-demand manager report (multi-user, no new hosting)

# Lets ANY manager get a real transfer plan/dashboard without a scheduled slot: open a GitHub
# issue titled "[add-manager] ..." with an `entry_id:` line in the body (the app's "Add your
# team" screen builds this URL for you -- see index.html's addTeamUrl()). Reuses
# run_transfer_planner_for_real_squad.py / export_app_data.py completely unmodified against a
# DB snapshot the last scheduled_pipeline.yml run already cached (see that workflow's own
# "Cache the freshly-ingested DB" step), so a single request never re-runs the full M0-M7
# pipeline. Falls back to a full ingestion only if no cache exists yet at all (e.g. the very
# first request in the app's history, before any scheduled run has happened).
#
# Deliberately issue-triggered rather than a workflow_dispatch called from a hosted proxy: no
# token needs to live anywhere outside GitHub itself, and opening an issue needs nothing but a
# GitHub account -- see the scouting-report roadmap's own notes on why this was chosen over a
# paid/free third-party host.
#
# SECURITY: the issue body/title are fully untrusted public input (anyone can open one). Nothing
# derived from them is ever spliced via ${{ }} into a run:/script: body -- only passed through
# `env:` and read back as a shell/environment variable, and entry_id/label are hard-sanitized to
# a narrow charset in the parse step before anything downstream touches them. Belt-and-suspenders:
# the env: routing means a future loosening of that sanitization charset can't reopen a YAML/shell
# injection path just because it happens to still be shell-metacharacter-safe today. Not instant:
# expect ~1-2 minutes (DB restore + a real M8/M9 solve). `concurrency` below serializes requests
# rather than letting an unbounded public queue run in parallel.
#
# Open to the general public, not just collaborators: this used to be gated to repo
# collaborators (OWNER/COLLABORATOR/MEMBER author_association) specifically to stop an
# unauthenticated public trigger from spamming issues to burn Actions minutes on a ~1-2 minute
# job each time -- the injection angle was already closed (see SECURITY above), so that gate was
# purely an anti-abuse measure, and it made "add your own team" (this workflow's whole
# documented purpose) require a maintainer to manually add every single real user as a repo
# collaborator first, which is not a self-serve flow. The `rate-limit` job below replaces it
# with the anti-abuse control this file's own prior version suggested as the alternative: a
# per-author cap (MAX_REQUESTS_PER_AUTHOR_PER_DAY) via the Search API's `author:`/`created:`
# filters, rather than a maintainer-applied label or an entry_id allowlist -- either of those
# is still a manual per-request gate, just a lighter one than "become a collaborator"; a rolling
# per-account cap is the only one of the three that's actually automatic end-to-end.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: on-demand-manager-report
  cancel-in-progress: false

env:
  # Generous enough for legitimate retries (a mistyped entry_id, trying a second team), tight
  # enough that spinning up many GitHub accounts is a much higher-effort abuse path than the
  # collaborator gate this replaces was defending against.
  MAX_REQUESTS_PER_AUTHOR_PER_DAY: 3

jobs:
  rate-limit:
    if: startsWith(github.event.issue.title, '[add-manager]')
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      # Counts this author's own [add-manager] issues (any state) opened in the last 24h,
      # excluding the one that just triggered this run. author_association can't be spoofed by
      # issue content (GitHub computes it server-side from the real account that opened the
      # issue), and the Search API query below is built entirely from trusted event fields
      # (repo slug, numeric issue number, login, ISO timestamp) -- never issue body/title text.
      - name: Check per-author rate limit
        id: check
        uses: actions/github-script@v9
        env:
          MAX_PER_DAY: ${{ env.MAX_REQUESTS_PER_AUTHOR_PER_DAY }}
        with:
          script: |
            const author = context.payload.issue.user.login;
            const since = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString().split('.')[0] + 'Z';
            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue author:${author} "[add-manager]" in:title created:>=${since}`;
            const result = await github.rest.search.issuesAndPullRequests({ q, per_page: 10 });
            const countExcludingThisOne = result.data.items.filter(i => i.number !== context.issue.number).length;
            const maxPerDay = Number(process.env.MAX_PER_DAY);
            const allowed = countExcludingThisOne < maxPerDay;
            core.setOutput('allowed', String(allowed));
            if (!allowed) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
                body: `You've already opened ${countExcludingThisOne} of these in the last 24 hours (limit: ${maxPerDay}/day, to keep this free for everyone). Feel free to reopen this issue after the window resets.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
                state: "closed", state_reason: "not_planned",
              });
            }

  handle-request:
    needs: rate-limit
    if: |
      startsWith(github.event.issue.title, '[add-manager]') &&
      needs.rate-limit.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FPL-Analyser
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Parses + hard-sanitizes entry_id/label from the untrusted issue body BEFORE anything
      # else touches them. ISSUE_BODY only ever reaches Python via an env var (never spliced
      # into the script text itself), and the sanitized outputs are constrained to a narrow,
      # injection-safe charset -- see this workflow's own top-of-file SECURITY note.
      - name: Parse and sanitize entry_id/label from the issue body
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 - <<'PYEOF'
          import os
          import re

          body = os.environ.get("ISSUE_BODY") or ""

          entry_match = re.search(r"entry_id\s*:\s*(\d{1,10})", body)
          if not entry_match or int(entry_match.group(1)) <= 0:
              print("::error::no valid entry_id found in the issue body (expected a line like 'entry_id: 1234567')")
              raise SystemExit(1)
          entry_id = entry_match.group(1)

          label_match = re.search(r"label\s*:\s*(.+)", body)
          raw_label = label_match.group(1).strip() if label_match else f"Manager {entry_id}"
          safe_label = re.sub(r"[^A-Za-z0-9 .'&-]", "", raw_label)[:40].strip() or f"Manager {entry_id}"

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"entry_id={entry_id}\n")
              f.write(f"label={safe_label}\n")
          PYEOF

      # Pinned lockfile, not requirements.txt -- see requirements.lock's own header for why
      # (SCIP tie-breaking and DuckDB constraint behavior are version-sensitive here).
      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Restore the most recent ingested DB
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: db/fpl_quant_v2.duckdb
          key: duckdb-restore-only-no-such-exact-key
          restore-keys: |
            duckdb-

      # Rare fallback: only when no scheduled run has EVER cached a DB yet. Mirrors
      # scheduled_pipeline.yml's own early steps exactly.
      - name: Fetch FPL-Core-Insights (public dataset) [cache miss fallback]
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/olbauday/FPL-Core-Insights.git \
            data/external/FPL-Core-Insights-main

      # See scheduled_pipeline.yml's own "Materialize evidence workbooks" step for why: retry
      # on a transient Drive hiccup, and sanity-check the download isn't actually Google's
      # virus-scan interstitial page.
      - name: Materialize evidence workbooks [cache miss fallback]
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/external
          fetch_drive_file() {
            local file_id="$1" out_path="$2"
            curl -sSL --fail --retry 5 --retry-delay 10 --retry-all-errors \
              "https://drive.google.com/uc?export=download&id=${file_id}" -o "${out_path}"
            local size
            size=$(stat -c%s "${out_path}")
            if [ "${size}" -lt 1024 ]; then
              echo "::error::${out_path} downloaded too small (${size} bytes) -- likely an interstitial/error page, not the real workbook"
              exit 1
            fi
            if head -c 256 "${out_path}" | grep -qi "<html"; then
              echo "::error::${out_path} looks like an HTML page, not an .xlsx workbook (Google Drive virus-scan interstitial?)"
              exit 1
            fi
          }
          fetch_drive_file "1DkoW82AD_kgN0VtKf9bjC2EyANmFPpAx" "data/external/FPL_Evidence_Claims_Research_Pull.xlsx"
          fetch_drive_file "190aVAPUl3zlwJCDXXofZdJEaGQ8NPCBC" "data/external/FPL_202627_Master_Evidence_Database.xlsx"

      - name: Run ingestion (M0-M6) [cache miss fallback]
        if: steps.cache.outputs.cache-hit != 'true'
        run: PYTHONPATH=src python scripts/run_ingestion.py

      - name: Determine current gameweek
        id: gw
        run: |
          python3 - <<'PYEOF'
          import os
          import sys

          sys.path.insert(0, "src")
          from fpl_quant import app_export as ax

          bootstrap = ax.fetch_bootstrap_static()
          event = ax.current_event(bootstrap)
          if event is None:
              print("::error::bootstrap-static reports no current gameweek right now")
              raise SystemExit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"event={event}\n")
          PYEOF

      # entry_id/event are already hard-validated as pure digits above, and label is
      # hard-sanitized to a narrow charset -- but routed through env: rather than spliced via
      # ${{ }} regardless, per this workflow's own top-of-file SECURITY note.
      - name: Plan transfers for the requested manager
        id: plan
        continue-on-error: true
        env:
          ENTRY_ID: ${{ steps.parse.outputs.entry_id }}
          EVENT: ${{ steps.gw.outputs.event }}
          LABEL: ${{ steps.parse.outputs.label }}
        run: |
          PYTHONPATH=src python scripts/run_transfer_planner_for_real_squad.py \
            "$ENTRY_ID" "$EVENT" "$LABEL"

      # Same perf fix as scheduled_pipeline.yml's own step of the same purpose (see
      # scripts/compute_shared_horizon.py's own module docstring): the three scripts in the
      # step below each independently recompute the SAME account-agnostic multi-gameweek
      # horizon (their own throwaway bootstrap call plus another inside tp.run()) -- 6
      # redundant computations for one manager, cut to 1 by computing it here once. Gated the
      # same way as the step it feeds (continue-on-error, only on a successful plan): this
      # cache is purely an optimization for that one step, never a hard dependency for the
      # rest of the workflow.
      - name: Compute shared multi-gameweek horizon once (perf fix, not per-script)
        if: steps.plan.outcome == 'success'
        continue-on-error: true
        env:
          EVENT: ${{ steps.gw.outputs.event }}
        run: |
          PYTHONPATH=src python scripts/compute_shared_horizon.py "$EVENT" /tmp/fpl_shared_horizon_ep_versions.json
          echo "FPL_SHARED_HORIZON_FILE=/tmp/fpl_shared_horizon_ep_versions.json" >> "$GITHUB_ENV"

      # Same fix as scheduled_pipeline.yml's own "Grade squad + explain best move"/"Run bench
      # what-if scenarios" steps: an on-demand-added manager was missing Features 2/3/4 ("Rate
      # My Team"/"Explain My Move"/"what-if" scenarios) entirely, not just getting them late --
      # index.html's fetches for squad_grade_<id>_latest.json/decision_<id>_latest.json/
      # scenarios_<id>_latest.json would 404 forever for this entry_id since nothing in this
      # workflow ever wrote them. continue-on-error: a manager who's added successfully
      # shouldn't be blocked from the app entirely just because these richer, secondary panels
      # fail to build.
      - name: Grade squad + explain best move + what-if scenarios for the requested manager
        if: steps.plan.outcome == 'success'
        continue-on-error: true
        env:
          ENTRY_ID: ${{ steps.parse.outputs.entry_id }}
          EVENT: ${{ steps.gw.outputs.event }}
        run: |
          PYTHONPATH=src python scripts/grade_squad.py "$ENTRY_ID" "$EVENT"
          PYTHONPATH=src python scripts/explain_my_move.py "$ENTRY_ID" "$EVENT"
          PYTHONPATH=src python scripts/run_scenarios.py "$ENTRY_ID" "$EVENT"

      - name: Export live app data for the requested manager
        if: steps.plan.outcome == 'success'
        env:
          ENTRY_ID: ${{ steps.parse.outputs.entry_id }}
          EVENT: ${{ steps.gw.outputs.event }}
          LABEL: ${{ steps.parse.outputs.label }}
        run: |
          PYTHONPATH=src python scripts/export_app_data.py "$ENTRY_ID:$EVENT:$LABEL"

      - name: Commit the new manager's dashboard data
        if: steps.plan.outcome == 'success'
        env:
          ENTRY_ID: ${{ steps.parse.outputs.entry_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dashboard/
          git diff --cached --quiet && exit 0
          git commit -m "chore: add manager $ENTRY_ID [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/5) -- fetching and rebasing onto the new master"
            git fetch origin master
            git rebase origin/master
          done
          echo "::error::git push kept failing after 5 rebase-and-retry attempts"
          exit 1

      # entry_id/label are passed via env (not spliced into the script text) even though they're
      # already sanitized -- belt-and-suspenders for anything that ever reaches actions/github-script.
      - name: Comment success and close the issue
        if: steps.plan.outcome == 'success'
        uses: actions/github-script@v9
        env:
          ENTRY_ID: ${{ steps.parse.outputs.entry_id }}
          LABEL: ${{ steps.parse.outputs.label }}
        with:
          script: |
            const { ENTRY_ID, LABEL } = process.env;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: `Done! **${LABEL}** (entry ${ENTRY_ID}) is now live in the app -- open it and pick this account from the switcher at the top.`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              state: "closed", state_reason: "completed",
            });

      - name: Comment failure and close the issue
        if: steps.plan.outcome != 'success'
        uses: actions/github-script@v9
        env:
          ENTRY_ID: ${{ steps.parse.outputs.entry_id }}
        with:
          script: |
            const { ENTRY_ID } = process.env;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: `Couldn't build a report for entry_id ${ENTRY_ID} -- double check the ID is correct (from your team's URL: fantasy.premierleague.com/entry/<id>/...) and that you've set a squad for the current gameweek. Feel free to reopen this issue to retry.`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              state: "closed", state_reason: "not_planned",
            });
