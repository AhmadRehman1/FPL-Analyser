name: Retrospective validation report regeneration

# Regenerates docs/reports/2025-26_retrospective_validation.md end to end (Track E, Phases
# E-1/E-2/E-3 -- see docs/plans/2026-08_retrospective_validation_and_ml_decision_plan.md), now
# that a real bench-order + formation-legality-preserving auto-substitution simulation exists
# (docs/reports/2026-09_model_failure_diagnosis.md, Workstream C's "harder half" --
# backtest.simulate_auto_substitutions()/run_season_simulation(simulate_auto_subs=True)).
# The committed report's headline number and its own caveats (e)/(f) predate BOTH the
# 2026-09-07 vice-captain fix and this auto-sub fix -- per the deferred task's own instruction,
# this needs a genuine regeneration, not a hand-edit of stale prose.
#
# Two independent, parallel jobs feed the final report job:
#   sample     -- scripts/run_retrospective_sample.py: a real, uniform-random ~2,000-entry
#                 sample of actual 2025-26 FPL season totals (tens of minutes, thousands of
#                 real requests against FPL's own public API -- this is a manual, rare dispatch,
#                 not a scheduled job, matching this script's own real intended use).
#   engine_sim -- scripts/run_retrospective_engine_simulation.py: a full, genuinely blind
#                 (every param version pinned to 1) GW2-38 walk with simulate_auto_subs=True,
#                 same cost class as the lambda/chip-timing sensitivity studies' own full-season
#                 arms (~1-3h).
# Neither writes anything under data/retrospective/ to git (gitignored by design -- aggregate-
# only real-manager data, regenerable, never committed). Only the final .md report is committed.

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: retrospective-validation-regen
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    # R6 (run_retrospective_sample.py's own docstring): a real live run is tens of minutes:
    # thousands of individual FPL API requests, each with real network latency.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.lock
      - name: Draw the real season-totals sample
        run: PYTHONPATH=src python scripts/run_retrospective_sample.py
      - uses: actions/upload-artifact@v7
        with:
          name: retrospective-sample
          path: data/retrospective/2025-2026_real_season_totals.json
          if-no-files-found: error
          retention-days: 7

  engine_sim:
    runs-on: ubuntu-latest
    # A full GW2-38 evolving-manager walk, same cost class as lambda_sensitivity.yml's own arms.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.lock

      # Same reasoning as the lambda/chip-timing sensitivity workflows' own prepare steps: the
      # narrower scheduled_pipeline.yml `duckdb-` cache lacks the multi-season Elo/team-alias
      # data team_strength.calibrate() needs for a historical-season fit.
      - name: Fetch FPL-Core-Insights (public dataset)
        run: git clone --depth 1 https://github.com/olbauday/FPL-Core-Insights.git data/external/FPL-Core-Insights-main

      - name: Materialize evidence workbooks
        run: |
          mkdir -p data/external
          fetch_drive_file() {
            local file_id="$1" out_path="$2"
            curl -sSL --fail --retry 5 --retry-delay 10 --retry-all-errors \
              "https://drive.google.com/uc?export=download&id=${file_id}" -o "${out_path}"
            local size; size=$(stat -c%s "${out_path}")
            if [ "${size}" -lt 1024 ]; then echo "::error::${out_path} too small (${size}b)"; exit 1; fi
            if head -c 256 "${out_path}" | grep -qi "<html"; then echo "::error::${out_path} is HTML not xlsx"; exit 1; fi
          }
          [ -f "data/external/FPL_Evidence_Claims_Research_Pull.xlsx" ] && echo "using committed research pull" || fetch_drive_file "1DkoW82AD_kgN0VtKf9bjC2EyANmFPpAx" "data/external/FPL_Evidence_Claims_Research_Pull.xlsx"
          fetch_drive_file "190aVAPUl3zlwJCDXXofZdJEaGQ8NPCBC" "data/external/FPL_202627_Master_Evidence_Database.xlsx"

      - name: Run ingestion (M0-M6)
        run: PYTHONPATH=src python scripts/run_ingestion.py

      - name: Run the blind engine simulation (GW2-38, simulate_auto_subs=True)
        run: PYTHONPATH=src python scripts/run_retrospective_engine_simulation.py

      - uses: actions/upload-artifact@v7
        with:
          name: retrospective-engine-sim
          path: data/retrospective/2025-2026_engine_simulation.json
          if-no-files-found: error
          retention-days: 7

  report:
    needs: [sample, engine_sim]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.lock

      - uses: actions/download-artifact@v8
        with:
          name: retrospective-sample
          path: data/retrospective
      - uses: actions/download-artifact@v8
        with:
          name: retrospective-engine-sim
          path: data/retrospective

      - name: Write the report
        run: PYTHONPATH=src python scripts/run_retrospective_report.py

      - name: Job summary
        if: always()
        run: |
          if [ -f docs/reports/2025-26_retrospective_validation.md ]; then
            cat docs/reports/2025-26_retrospective_validation.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report produced -- see the report step log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit the regenerated report
        run: |
          bash scripts/ci_commit_generated.sh \
            "chore: regenerate 2025-26 retrospective validation report (real auto-sub + vice-captain fixes) [skip ci]" \
            docs/reports/2025-26_retrospective_validation.md
