name: Diagnose live minutes and EP (cached DB)

# Re-runs the live minutes model and EP for one gameweek with the own substitute rate on and off,
# on the most recent cached ingested DB, to attribute a live projection change. Uploads the JSON;
# commits nothing (the DB copy is never saved back).

on:
  workflow_dispatch:
    inputs:
      args:
        description: 'Gameweek then player name fragments, e.g. "7 haaland salah"'
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Restore the most recent ingested DB
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: db/fpl_quant_v2.duckdb
          key: duckdb-restore-only-no-such-exact-key
          restore-keys: |
            duckdb-

      - name: Fail if no cached DB was restored
        if: ${{ steps.cache.outputs.cache-matched-key == '' }}
        run: |
          echo "::error::no cached DB to diagnose"
          exit 1

      - name: Diagnose
        run: |
          set -o pipefail
          echo "db cache: ${{ steps.cache.outputs.cache-matched-key }}" >> "$GITHUB_STEP_SUMMARY"
          PYTHONPATH=src python scripts/diagnose_live_minutes.py ${{ inputs.args }} | tee diagnose_live_minutes.json
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat diagnose_live_minutes.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: diagnose-live-minutes
          path: diagnose_live_minutes.json
